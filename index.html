<section id="idle">
  <div id="clock"></div>
  <div id="date"></div>
  <p id="idle-note" hidden></p>
</section>

<div id="offline" hidden>Can't reach your Mac. Retrying.</div>


<script>
const $ = id => document.getElementById(id);
const POLL_MS = 1000;
const IDLE_AFTER_PAUSE_MS = 5 * 60 * 1000;
const STEP = 0.25;

const view = { key: null, status: null, lines: [], plain: false, offset: 0, active: -2, plainY: null, art: null, roman: {}, english: {}, natural: {}, translating: false, naturalizing: false, hasExtras: false };
const clock = { pos: 0, at: performance.now(), running: false };
let duration = 0, pausedSince = null, failures = 0, timingTimer = null;

function store(action) { try { return action(localStorage); } catch { return null; } }
const loadOffset = key => Number(store(s => s.getItem('offset:' + key))) || 0;
const saveOffset = (key, v) => store(s => v ? s.setItem('offset:' + key, v) : s.removeItem('offset:' + key));
const extras = {
  roman: store(s => s.getItem('show:roman')) !== '0',
  english: store(s => s.getItem('show:english')) !== '0',
  natural: store(s => s.getItem('show:natural')) === '1',
};
let activeTab = ['vis', 'tidbits'].includes(store(s => s.getItem('tab'))) ? store(s => s.getItem('tab')) : 'lyrics';
const vis = {
  source: null, running: false, last: 0, playing: false, error: '', lastSound: 0, ceiling: .3,
  vocalRaw: 0, vocal: 0, vocalFloor: .5, vocalTop: .6, lastFrame: 0, wordsRunning: false, wordsLast: 0, sungIndex: -9, sung: 0,
  target: new Array(32).fill(0), wave: new Array(96).fill(127.5), bands: new Array(32).fill(0),
  time: 0, bass: 0, bassAvg: 0, kick: 0, energy: 0, spin: 0,
  lineWords: [], lineFont: '', center: [.5, .5], scrim: [.5, .5, .4, .2], scrimOn: 0, scrimTarget: 0,
  noScene: false, ripples: [], artBlend: 1,
};
const touches = [];
const tidbit = { key: null, status: '', items: [], index: 0, shown: 0, dwell: 8, step: 0, steps: 4, stepAt: 0, label: '', timer: 0 };
const calmMotion = matchMedia('(prefers-reduced-motion: reduce)');
const FALLBACK_PALETTE = { voice: [.98, .66, .4], music: [.26, .36, .86], deep: [.05, .06, .13] };
const palette = {
  goal: FALLBACK_PALETTE,
  voice: [...FALLBACK_PALETTE.voice], music: [...FALLBACK_PALETTE.music], deep: [...FALLBACK_PALETTE.deep],
};
const scene = { gl: null };

function position() {
  return clock.running ? clock.pos + (performance.now() - clock.at) / 1000 : clock.pos;
}

function syncClock(measured, running) {
  const drift = measured - position();
  if (!running || !clock.running || Math.abs(drift) > 0.4) {
    clock.pos = measured;
    clock.at = performance.now();
  } else {
    clock.pos += drift * 0.2;   // nudge gently so lines never jump on a noisy reading
  }
  clock.running = running;
}

function clearLyrics() {
  $('lines').textContent = '';
  $('lines').style.transform = 'translateY(0)';
  $('stage').classList.remove('plain', 'extras');
  view.roman = {};
  view.english = {};
  view.natural = {};
  view.naturalizing = false;
  view.translating = false;
  view.hasExtras = false;
  view.lines = [];
  view.plain = false;
  view.active = -2;
  view.plainY = null;
  syncSplit();
}

function note(text) {
  $('note').textContent = text || '';
  $('note').hidden = !text;
}

function showTab() {
  $('stage').classList.toggle('vis', activeTab === 'vis');
  $('stage').classList.toggle('tidbits', activeTab === 'tidbits');
  for (const name of ['lyrics', 'vis', 'tidbits']) $('tab-' + name).setAttribute('aria-selected', activeTab === name);
  $('now').dataset.tab = activeTab;
  placeDrop(true);
  syncSplit();
  syncLevels();
  if (activeTab === 'lyrics') placeActive(true);
  else if (activeTab === 'vis') { fitVisLine(); placePager(false); wakePager(); }
  else loadTidbits();
}

let dropAt = null;

// The drop stretches across the gap, thinning as it goes, then settles on the new tab.
function placeDrop(animated) {
  const on = $('tab-' + activeTab), drop = $('tab-drop');
  const x = on.offsetLeft, w = on.offsetWidth;
  if (!w) return;
  drop.style.width = w + 'px';
  drop.style.transform = `translateX(${x}px)`;
  if (animated && dropAt && dropAt.x !== x && !calmMotion.matches) {
    const left = Math.min(dropAt.x, x), span = Math.max(dropAt.x + dropAt.w, x + w) - left;
    drop.animate([
      { transform: `translateX(${dropAt.x}px)`, width: dropAt.w + 'px' },
      { transform: `translateX(${left}px) scaleY(.78)`, width: span + 'px', offset: .42 },
      { transform: `translateX(${x}px)`, width: w + 'px' },
    ], { duration: 480, easing: 'cubic-bezier(.22, 1, .36, 1)' });
  }
  dropAt = { x, w };
}

function setTab(name) {
  activeTab = name;
  store(s => s.setItem('tab', name));
  showTab();
}

const onScreen = () => !document.hidden && !$('now').hidden;
const visWanted = () => activeTab === 'vis' && onScreen();
const levelsWanted = () => onScreen() && (vis.playing || activeTab === 'vis');

function syncLevels() {
  document.body.classList.toggle('vis-on', visWanted());
  syncFlood();
  if (visWanted() && !scene.gl && !vis.noScene) startScene();
  const want = levelsWanted();
  if (want && !vis.source) {
    vis.lastSound = performance.now();
    vis.source = new EventSource('/api/levels');
    vis.source.onmessage = e => {
      const data = JSON.parse(e.data);
      vis.error = data.error || '';
      if (data.error) return;
      vis.target = data.b;
      vis.wave = data.w;
      vis.vocalRaw = (data.v || 0) / 255;
      vis.lastFrame = performance.now();
      if (data.b.some(v => v > 0)) vis.lastSound = performance.now();
    };
  } else if (!want && vis.source) {
    vis.source.close();
    vis.source = null;
  }
  if (visWanted() && !vis.running) {
    vis.running = true;
    vis.last = performance.now();
    sizeVis();
    requestAnimationFrame(drawVis);
  }
  if (onScreen() && !vis.wordsRunning) {
    vis.wordsRunning = true;
    vis.wordsLast = performance.now();
    requestAnimationFrame(wordFrame);
  }
}

function updateVocal(dt) {
  // Compares the voice estimate with its own recent range, so any mix or volume works.
  const raw = vis.vocalRaw;
  vis.vocalFloor = Math.min(raw, vis.vocalFloor + .03 * dt);
  vis.vocalTop = Math.max(raw, vis.vocalTop - .04 * dt, vis.vocalFloor + .1);
  const target = Math.min(1, Math.max(0, (raw - vis.vocalFloor) / (vis.vocalTop - vis.vocalFloor)));
  vis.vocal += (target - vis.vocal) * Math.min(1, dt * (target > vis.vocal ? 30 : 7));
}

function paintWords(words, sung) {
  const weights = [...words].map(word => Math.max(2, Array.from(word.textContent).length));
  const total = weights.reduce((a, b) => a + b, 0);
  let used = 0;
  [...words].forEach((word, i) => {
    const from = used / total;
    used += weights[i];
    const to = used / total;
    const state = sung >= to ? 'word sung' : sung <= from ? 'word' : 'word active';
    if (word.className !== state) word.className = state;
    if (state === 'word active') {
      word.style.setProperty('--p', Math.round((sung - from) / (to - from) * 100));
      word.style.setProperty('--v', vis.vocal.toFixed(2));
    }
  });
}

function wordFrame(now) {
  if (!onScreen()) { vis.wordsRunning = false; return; }
  requestAnimationFrame(wordFrame);
  const dt = Math.min(.1, (now - vis.wordsLast) / 1000);
  vis.wordsLast = now;
  updateVocal(dt);
  if (activeTab === 'tidbits' && !calmMotion.matches) $('tb-head').style.setProperty('--v', vis.vocal.toFixed(2));

  const line = view.lines[view.active];
  if (!line || !line.text) { vis.sungIndex = view.active; return; }
  const next = view.lines[view.active + 1];
  const windowLength = Math.max(.3, (next ? next.t : line.t + 6) - line.t);
  const original = line.text.trim();
  const letters = (view.roman[original] || original).replace(/\s/g, '').length;
  // Most lines are sung in less time than the gap before the next one.
  // A held, slow line fills the time it has, up to a slow singing pace; a long gap doesn't stretch it.
  const singing = Math.max(.25, Math.min(windowLength * .92, Math.max(1.2, letters * .22, Math.min(windowLength * .85, letters * .75))));
  const expected = (Math.max(0, position()) + view.offset - line.t) / singing;

  if (vis.sungIndex !== view.active) {
    vis.sungIndex = view.active;
    vis.sung = Math.max(0, Math.min(1, expected));
  } else if (clock.running) {
    // Moves with the voice, but stays anchored to the line's real timing.
    const heard = performance.now() - vis.lastFrame < 1500;
    const pace = !heard ? 1 : vis.vocal > .38 ? 1.2 : .3;
    vis.sung += dt / singing * pace;
    vis.sung = Math.max(expected - .22, Math.min(expected + .12, vis.sung));
    vis.sung = Math.max(0, Math.min(1, vis.sung));
  }

  const li = $('lines').children[view.active];
  if (li) {
    paintWords(li.querySelectorAll('.original .word'), vis.sung);
  }
  if (activeTab === 'vis') paintWords($('vis-line').querySelectorAll('.word'), vis.sung);
  else if (activeTab === 'lyrics') paintWords($('gloss-roman').querySelectorAll('.word'), vis.sung);
}

function setWords(element, text) {
  element.textContent = '';
  for (const part of text.split(/(\s+)/)) {
    if (!part) continue;
    if (!part.trim()) { element.append(part); continue; }
    const word = document.createElement('span');
    word.className = 'word';
    word.textContent = part;
    element.append(word);
  }
}

// --- The visualizer ------------------------------------------------------------
// One image that keeps feeding on itself: each frame is the last frame, drifted outward
// and faded, with this frame's "ink" added. Red ink is the words being sung; green ink is
// a ring shaped by the music. The final pass colors each from the album art.

const FIELD_SCALE = .6;   // the field is soft by nature, so it runs well below screen resolution

const VERTEX = `attribute vec2 corner; varying vec2 v;
void main() { v = corner * .5 + .5; gl_Position = vec4(corner, 0., 1.); }`;

const FLOW_SHADER = `precision highp float;
varying vec2 v;
uniform sampler2D field, ink;
uniform vec2 aspect, center;
uniform float time, zoom, twist, curl, fade, floorFade;
uniform vec4 touch[3];
void main() {
  vec2 p = (v - center) * aspect;
  for (int i = 0; i < 3; i++) {   // a moving finger drags the picture along with it
    vec2 d = (v - touch[i].xy) * aspect;
    p -= touch[i].zw * aspect * exp(-dot(d, d) / .03);
  }
  p *= 1. - zoom;
  float a = twist * (.35 + length(p));
  float c = cos(a), s = sin(a);
  p = vec2(c * p.x - s * p.y, s * p.x + c * p.y);
  p += curl * vec2(sin(p.y * 6. + time * .7) + .5 * sin(p.y * 13. - time * 1.1),
                   sin(p.x * 6. - time * .6) + .5 * sin(p.x * 11. + time * .9));
  vec3 old = max(texture2D(field, p / aspect + center).rgb * fade - floorFade, 0.);
  vec3 added = texture2D(ink, v).rgb;
  gl_FragColor = vec4(old + added * (1. - old), 1.);
}`;

const SHOW_SHADER = `precision highp float;
varying vec2 v;
uniform sampler2D field, artNew, artOld;
uniform vec3 voice, music, deep;
uniform vec4 scrim;
uniform float time, scrimOn, kick, artBlend;
float grain(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233)) + time) * 43758.5453); }
void main() {
  vec3 f = texture2D(field, v).rgb;
  float sound = f.g * f.g * (3. - 2. * f.g);
  vec3 cover = mix(texture2D(artOld, v).rgb, texture2D(artNew, v).rgb, artBlend);   // the album's colours, where they sit on it
  vec3 color = deep * (1. + kick * .6) + cover * sound + voice * f.r * 1.15;
  color += (voice + music) * sound * f.r * .35;
  color += (voice + music) * .62 * f.b;
  float q = length((v - scrim.xy) / scrim.zw);
  color = 1. - exp(-color * 1.05);   // bright overlaps stay colored instead of clipping to white
  color *= 1. - .74 * scrimOn * (1. - smoothstep(.72, 1.5, q));   // keeps the words readable
  color *= (.4 + .6 * smoothstep(0., .17, v.y)) * (.4 + .6 * smoothstep(0., .14, 1. - v.y));
  gl_FragColor = vec4(color + (grain(gl_FragCoord.xy) - .5) * 2. / 255., 1.);
}`;

function makeProgram(gl, fragment) {
  const program = gl.createProgram();
  for (const [type, source] of [[gl.VERTEX_SHADER, VERTEX], [gl.FRAGMENT_SHADER, fragment]]) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    gl.attachShader(program, shader);
  }
  gl.bindAttribLocation(program, 0, 'corner');
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  const uniforms = {};
  for (let i = 0; i < gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS); i++) {
    const name = gl.getActiveUniform(program, i).name;
    uniforms[name] = gl.getUniformLocation(program, name);
  }
  return { program, uniforms };
}

function makeTexture(gl) {
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return texture;
}

function startScene() {
  const canvas = $('vis');
  if (!scene.listening) {
    scene.listening = true;
    canvas.addEventListener('webglcontextlost', e => {
      e.preventDefault();
      scene.gl = null;
      document.body.classList.remove('vis-gl');
    });
    canvas.addEventListener('webglcontextrestored', () => { startScene(); sizeVis(); });
  }
  const gl = canvas.getContext('webgl', { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: 'low-power' });
  if (!gl) { vis.noScene = true; return; }   // the blurred album art stays behind the words
  try {
    scene.flow = makeProgram(gl, FLOW_SHADER);
    scene.show = makeProgram(gl, SHOW_SHADER);
  } catch {
    vis.noScene = true;
    return;
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  scene.inkTexture = makeTexture(gl);
  scene.inkCanvas = scene.inkCanvas || document.createElement('canvas');
  scene.inkContext = scene.inkContext || scene.inkCanvas.getContext('2d', { alpha: false });
  scene.fields = [0, 1].map(() => ({ texture: makeTexture(gl), buffer: gl.createFramebuffer() }));
  scene.covers = [makeTexture(gl), makeTexture(gl)];
  scene.w = 0;
  scene.gl = gl;
  const cover = palette.goal.art || solidCover(palette.goal.music);
  uploadCover(cover);
  uploadCover(cover);
  vis.artBlend = 1;
  document.body.classList.add('vis-gl');
}

function sizeVis() {
  const canvas = $('vis'), gl = scene.gl;
  if (gl && canvas.clientWidth) {
    const scale = Math.min(2, devicePixelRatio || 1);
    const width = Math.round(canvas.clientWidth * scale), height = Math.round(canvas.clientHeight * scale);
    if (canvas.width !== width || canvas.height !== height) { canvas.width = width; canvas.height = height; }
    const fieldW = Math.max(2, Math.round(canvas.clientWidth * FIELD_SCALE));
    const fieldH = Math.max(2, Math.round(canvas.clientHeight * FIELD_SCALE));
    if (scene.w !== fieldW || scene.h !== fieldH) {
      scene.w = fieldW;
      scene.h = fieldH;
      scene.inkCanvas.width = fieldW;
      scene.inkCanvas.height = fieldH;
      for (const field of scene.fields) {
        gl.bindTexture(gl.TEXTURE_2D, field.texture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, fieldW, fieldH, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.bindFramebuffer(gl.FRAMEBUFFER, field.buffer);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, field.texture, 0);
        gl.clearColor(0, 0, 0, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
      }
    }
  }
  fitVisLine();
}

// Sets the line as large as it will fit, then records where each word landed so the
// words can be drawn into the picture in the same places.
function fitVisLine() {
  const canvas = $('vis'), box = $('vis-lyric'), line = $('vis-line');
  vis.lineWords = [];
  vis.scrimTarget = 0;
  if (!box.clientHeight) return;
  const screenW = canvas.clientWidth || innerWidth, screenH = canvas.clientHeight || innerHeight;
  const stage = $('stage').getBoundingClientRect();
  vis.center = [(stage.left + stage.width / 2) / screenW, 1 - (stage.top + stage.height / 2) / screenH];
  vis.ring = [stage.width * .47 / screenW, stage.height * .44 / screenH];
  if (!line.textContent) return;

  let size = Math.min(box.clientWidth * .125, box.clientHeight * .2, 72);
  line.style.fontSize = size + 'px';
  while (size > 18 && (line.scrollWidth > box.clientWidth + 1 || line.offsetHeight > box.clientHeight * .84)) {
    size -= 2;
    line.style.fontSize = size + 'px';
  }

  const k = scene.w ? scene.w / screenW : 1;
  const style = getComputedStyle(line);
  vis.lineFont = `${style.fontWeight} ${size * k}px ${style.fontFamily}`;
  let left = Infinity, right = 0, top = Infinity, bottom = 0;
  vis.lineWords = [...line.querySelectorAll('.word')].map(el => {
    const r = el.getBoundingClientRect();
    left = Math.min(left, r.left); right = Math.max(right, r.right);
    top = Math.min(top, r.top); bottom = Math.max(bottom, r.bottom);
    return { el, text: el.textContent, x: (r.left + r.width / 2) * k, y: (r.top + r.height / 2) * k };
  });
  vis.scrim = [
    (left + right) / 2 / screenW, 1 - (top + bottom) / 2 / screenH,
    Math.max(.2, (right - left) / 2 / screenW * 1.25), Math.max(.06, (bottom - top) / 2 / screenH * 1.3),
  ];
  vis.scrimTarget = 1;
}

function readMusic(now, dt) {
  const live = now - vis.lastFrame < 800;
  vis.ceiling = Math.max(Math.max(...vis.target) / 255, vis.ceiling - .05 * dt, .3);
  let total = 0;
  for (let i = 0; i < vis.bands.length; i++) {
    const level = live ? Math.min(1, (vis.target[i] || 0) / 255 / vis.ceiling) : 0;
    vis.bands[i] += (level - vis.bands[i]) * Math.min(1, dt * (level > vis.bands[i] ? 26 : 6));
    total += vis.bands[i];
  }
  vis.energy = total / vis.bands.length;
  vis.bass = (vis.bands[0] + vis.bands[1] + vis.bands[2] + vis.bands[3] + vis.bands[4] + vis.bands[5]) / 6;
  vis.bassAvg += (vis.bass - vis.bassAvg) * Math.min(1, dt * 1.6);
  vis.kick = Math.max(vis.kick - dt * 3.2, Math.min(1, Math.max(0, (vis.bass - vis.bassAvg) * 3.4)));
}

function drawInk(dt) {
  const c = scene.inkContext, W = scene.w, H = scene.h;
  c.globalCompositeOperation = 'source-over';
  c.fillStyle = '#000';
  c.fillRect(0, 0, W, H);
  c.globalCompositeOperation = 'lighter';
  const flow = Math.min(1, dt * 45);

  // A ring around the line, pushed out of shape by the music. Low notes sit at one
  // side and high notes at the other, mirrored so the loop closes without a seam.
  const cx = vis.center[0] * W, cy = (1 - vis.center[1]) * H;
  const [ringX, ringY] = vis.ring || [.4, .3];
  const count = 96, points = [];
  for (let i = 0; i < count; i++) {
    const mirror = Math.abs(i / count * 2 - 1);
    const place = mirror * (vis.bands.length - 1), low = Math.floor(place);
    const band = vis.bands[low] + (vis.bands[Math.min(low + 1, vis.bands.length - 1)] - vis.bands[low]) * (place - low);
    const shake = (vis.wave[Math.round(mirror * (vis.wave.length - 1))] - 127.5) / 127.5;
    const reach = .8 + band * band * .32 + shake * .04 + vis.kick * .04;   // stays clear of the words
    const angle = i / count * Math.PI * 2 + vis.spin;
    points.push([cx + Math.cos(angle) * ringX * W * reach, cy + Math.sin(angle) * ringY * H * reach]);
  }
  c.strokeStyle = `rgba(0, 255, 0, ${(.1 + Math.min(1, vis.energy * 1.5) * .9) * flow})`;
  c.lineWidth = (1 + vis.kick * 2) * W / 234;
  c.lineJoin = 'round';
  c.beginPath();
  points.forEach((point, i) => {
    const next = points[(i + 1) % count];
    const midX = (point[0] + next[0]) / 2, midY = (point[1] + next[1]) / 2;
    if (i) c.quadraticCurveTo(point[0], point[1], midX, midY); else c.moveTo(midX, midY);
  });
  c.closePath();
  c.stroke();

  // The word being sung gives off light with the voice, then keeps a little glow.
  c.font = vis.lineFont;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  for (const word of vis.lineWords) {
    const state = word.el.className;
    const level = state.includes('active') ? .3 + vis.vocal * .7 : state.includes('sung') ? .06 + vis.vocal * .2 : 0;
    if (!level) continue;
    c.fillStyle = `rgba(255, 0, 0, ${level * flow})`;
    c.fillText(word.text, word.x, word.y);
  }

  // Touch: light under the finger, and a ripple where it landed.
  for (const touch of touches) {
    if (!touch.down) continue;
    const x = touch.x * W, y = (1 - touch.y) * H, reach = W * .1;
    const glow = c.createRadialGradient(x, y, 0, x, y, reach);
    glow.addColorStop(0, `rgba(0, 0, 255, ${.5 * flow})`);
    glow.addColorStop(1, 'rgba(0, 0, 255, 0)');
    c.fillStyle = glow;
    c.fillRect(x - reach, y - reach, reach * 2, reach * 2);
  }
  vis.ripples = vis.ripples.filter(ripple => (ripple.age += dt) < .8);
  c.lineWidth = W / 130;
  for (const ripple of vis.ripples) {
    c.strokeStyle = `rgba(0, 0, 255, ${(1 - ripple.age / .8) * .85 * flow})`;
    c.beginPath();
    c.arc(ripple.x * W, (1 - ripple.y) * H, W * (.04 + ripple.age * .6), 0, Math.PI * 2);
    c.stroke();
  }
}

function stepField(dt) {
  const gl = scene.gl, { program, uniforms: u } = scene.flow, calm = calmMotion.matches;
  const [from, to] = scene.fields;
  gl.bindFramebuffer(gl.FRAMEBUFFER, to.buffer);
  gl.viewport(0, 0, scene.w, scene.h);
  gl.useProgram(program);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, from.texture);
  gl.uniform1i(u.field, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, scene.inkTexture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, scene.inkCanvas);
  gl.uniform1i(u.ink, 1);
  const short = Math.min(scene.w, scene.h);
  gl.uniform2f(u.aspect, scene.w / short, scene.h / short);
  gl.uniform2f(u.center, vis.center[0], vis.center[1]);
  gl.uniform1f(u.time, vis.time);
  gl.uniform1f(u.zoom, calm ? 0 : 1 - Math.exp(-(.2 + vis.kick * 1.1 + vis.energy * .22) * dt));
  gl.uniform1f(u.twist, calm ? 0 : Math.sin(vis.time * .09) * (.08 + vis.vocal * .34) * dt);
  gl.uniform1f(u.curl, calm ? 0 : .07 * (1 + vis.energy * 2) * dt);
  gl.uniform1f(u.fade, Math.exp(-(calm ? 2.4 : 1.05) * dt));
  gl.uniform1f(u.floorFade, .6 / 255 * dt * 60);
  const pull = new Float32Array(12);
  touches.slice(0, 3).forEach((touch, i) => {
    pull.set(calm ? [touch.x, touch.y, 0, 0] : [touch.x, touch.y, touch.vx * 1.2, touch.vy * 1.2], i * 4);
    touch.vx *= .7;
    touch.vy *= .7;
  });
  gl.uniform4fv(u['touch[0]'], pull);
  for (let i = touches.length - 1; i >= 0; i--) {
    if (!touches[i].down && Math.hypot(touches[i].vx, touches[i].vy) < .0003) touches.splice(i, 1);
  }
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  scene.fields = [to, from];
}

function showField(dt) {
  const gl = scene.gl, canvas = $('vis'), { program, uniforms: u } = scene.show;
  vis.scrimOn += (vis.scrimTarget - vis.scrimOn) * Math.min(1, dt * 5);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(program);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, scene.fields[0].texture);
  gl.uniform1i(u.field, 0);
  vis.artBlend = Math.min(1, vis.artBlend + dt * .8);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, scene.covers[0]);
  gl.uniform1i(u.artNew, 1);
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, scene.covers[1]);
  gl.uniform1i(u.artOld, 2);
  gl.uniform1f(u.artBlend, vis.artBlend);
  gl.uniform3fv(u.voice, palette.voice);
  gl.uniform3fv(u.music, palette.music);
  gl.uniform3fv(u.deep, palette.deep);
  gl.uniform4fv(u.scrim, vis.scrim);
  gl.uniform1f(u.scrimOn, vis.scrimOn);
  gl.uniform1f(u.kick, vis.kick);
  gl.uniform1f(u.time, vis.time % 100);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function fromHSV(h, s, v) {
  const f = (n, k = (n + h * 6) % 6) => v - v * s * Math.max(0, Math.min(k, 4 - k, 1));
  return [f(5), f(3), f(1)];
}

function toHSV(r, g, b) {
  const top = Math.max(r, g, b), range = top - Math.min(r, g, b);
  if (!range) return [0, 0, top];
  const hue = top === r ? ((g - b) / range + 6) % 6 : top === g ? (b - r) / range + 2 : (r - g) / range + 4;
  return [hue / 6, range / top, top];
}

// Keeps a colour's character but makes sure it shows up as light on a dark screen.
function asLight([r, g, b], minValue, minSaturation) {
  const [h, s, v] = toHSV(r, g, b);
  return fromHSV(h, s < .12 ? s : Math.max(s, minSaturation), Math.max(v, minValue));
}

function solidCover([r, g, b]) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 1;
  const c = canvas.getContext('2d');
  c.fillStyle = `rgb(${Math.round(r * 255)} ${Math.round(g * 255)} ${Math.round(b * 255)})`;
  c.fillRect(0, 0, 1, 1);
  return canvas;
}

function uploadCover(canvas) {
  const gl = scene.gl;
  if (!gl) return;
  const [newest, older] = scene.covers;
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, older);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, canvas);
  scene.covers = [older, newest];
  vis.artBlend = 0;
}

// A tiny copy of the cover holding the most vivid colour from each area, since plain
// averaging turns a busy cover beige. Black and grey areas borrow the main colour,
// because they would otherwise show nothing when the music lights them up.
function coverLight(image, main) {
  const cells = 18, detail = 5, full = cells * detail;
  const source = document.createElement('canvas'), canvas = document.createElement('canvas');
  source.width = source.height = full;
  canvas.width = canvas.height = cells;
  const from = source.getContext('2d', { willReadFrequently: true });
  from.drawImage(image, 0, 0, full, full);
  const pixels = from.getImageData(0, 0, full, full).data;
  const c = canvas.getContext('2d');
  const picture = c.createImageData(cells, cells);
  for (let y = 0; y < cells; y++) {
    for (let x = 0; x < cells; x++) {
      let best = null, bestScore = -1;
      for (let py = y * detail; py < (y + 1) * detail; py++) {
        for (let px = x * detail; px < (x + 1) * detail; px++) {
          const i = (py * full + px) * 4;
          const hsv = toHSV(pixels[i] / 255, pixels[i + 1] / 255, pixels[i + 2] / 255);
          const score = hsv[1] * hsv[2];
          if (score > bestScore) { bestScore = score; best = hsv; }
        }
      }
      const [h, s, v] = best;
      const lit = v < .14 || s < .08 ? main : fromHSV(h, Math.min(1, Math.max(s * 1.15, s < .2 ? s : .55)), Math.max(v, .76));
      const at = (y * cells + x) * 4;
      picture.data[at] = lit[0] * 255; picture.data[at + 1] = lit[1] * 255; picture.data[at + 2] = lit[2] * 255; picture.data[at + 3] = 255;
    }
  }
  c.putImageData(picture, 0, 0);
  return canvas;
}

function paletteFrom(image) {
  const size = 40, sample = document.createElement('canvas');
  sample.width = sample.height = size;
  const c = sample.getContext('2d', { willReadFrequently: true });
  c.drawImage(image, 0, 0, size, size);
  const data = c.getImageData(0, 0, size, size).data;
  const bins = Array.from({ length: 24 }, () => ({ score: 0, pull: 0, r: 0, g: 0, b: 0 }));
  let colourful = 0;
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i] / 255, g = data[i + 1] / 255, b = data[i + 2] / 255;
    const [h, s, v] = toHSV(r, g, b);
    if (s < .12 || v < .1) continue;
    if (s > .2 && v > .15) colourful++;
    const weight = s * v, pull = weight * s * s, bin = bins[Math.floor(h * 24) % 24];   // vivid pixels set the shade
    bin.score += weight; bin.pull += pull; bin.r += r * pull; bin.g += g * pull; bin.b += b * pull;
  }
  if (colourful / (size * size) < .06) {
    const mono = { voice: [.93, .9, .85], music: [.55, .57, .62], deep: [.05, .05, .06] };
    return { ...mono, art: coverLight(image, mono.music) };
  }
  const around = i => [-1, 0, 1].map(d => bins[(i + d + 24) % 24]);
  const strength = bins.map((_, i) => around(i).reduce((sum, bin) => sum + bin.score, 0));
  // The true average colour of that part of the cover, rather than a stock shade of its hue.
  const colourOf = i => {
    const group = around(i), total = group.reduce((sum, bin) => sum + bin.pull, 0) || 1;
    return ['r', 'g', 'b'].map(key => group.reduce((sum, bin) => sum + bin[key], 0) / total);
  };
  const first = strength.indexOf(Math.max(...strength));
  const apart = i => Math.min((i - first + 24) % 24, (first - i + 24) % 24);
  const others = strength.map((score, i) => (apart(i) >= 4 ? score : 0));
  const best = Math.max(...others);
  const main = colourOf(first);
  const accent = best > strength[first] * .05 ? colourOf(others.indexOf(best)) : main;
  const music = asLight(main, .74, .5);
  const [h, s] = toHSV(...main);
  return { music, voice: asLight(accent, .96, .5), deep: fromHSV(h, Math.min(s, .6), .12), art: coverLight(image, music) };
}

function setPalette(chosen) {
  palette.goal = chosen;
  uploadCover(chosen.art || solidCover(chosen.music));
  document.documentElement.style.setProperty('--accent', `rgb(${chosen.voice.map(v => Math.round(v * 255)).join(' ')})`);
}

function loadPalette(art) {
  if (!art) { setPalette(FALLBACK_PALETTE); return; }
  const image = new Image();
  image.onload = () => {
    if (view.art !== art) return;
    try { setPalette(paletteFrom(image)); } catch { setPalette(FALLBACK_PALETTE); }
  };
  image.src = '/art?id=' + art;
}

function screenPoint(event) {
  const canvas = $('vis');
  return [event.clientX / (canvas.clientWidth || innerWidth), 1 - event.clientY / (canvas.clientHeight || innerHeight)];
}

// A touch only ever moves the picture. Controls open with a double tap, on any tab.
let press = null, lastTap = { at: -1e9, x: 0, y: 0 };

function pointerDown(event) {
  if (event.target.closest('#tabs, #timing, #vis-pager')) return;
  press = { id: event.pointerId, x: event.clientX, y: event.clientY, at: event.timeStamp };
  if (activeTab !== 'vis') return;
  const [x, y] = screenPoint(event);
  if (touches.length < 3) touches.push({ id: event.pointerId, x, y, vx: 0, vy: 0, down: true });
  if (!calmMotion.matches) vis.ripples = [...vis.ripples.slice(-5), { x, y, age: 0 }];
  try { $('now').setPointerCapture(event.pointerId); } catch { /* the touch still works */ }
}

function pointerMove(event) {
  if (press && press.id === event.pointerId && activeTab === 'vis') {
    const sideways = event.clientX - press.x, upright = event.clientY - press.y;
    if (Math.abs(sideways) > 12 && Math.abs(sideways) > Math.abs(upright)) {
      press.dragged = true;
      wakePager();
      placePager(false, Math.max(-1, Math.min(1, -sideways / 140)));
    }
  }
  const touch = touches.find(t => t.id === event.pointerId && t.down);
  if (!touch) return;
  const [x, y] = screenPoint(event);
  touch.vx += x - touch.x;
  touch.vy += y - touch.y;
  touch.x = x;
  touch.y = y;
}

function pointerEnd(event) {
  const touch = touches.find(t => t.id === event.pointerId && t.down);
  if (touch) touch.down = false;
  if (event.type !== 'pointerup' || !press || press.id !== event.pointerId) return;
  const sideways = event.clientX - press.x, upright = event.clientY - press.y;
  if (activeTab === 'vis' && press.dragged) {
    const next = VIS_STYLES[VIS_STYLES.indexOf(visStyle) + (sideways < 0 ? 1 : -1)];
    press = null;
    if (Math.abs(sideways) > 60 && Math.abs(upright) < 80 && next) setVisStyle(next);
    else placePager(true);   // not far enough, or nothing that way: the drop springs back
    return;
  }
  const still = Math.hypot(event.clientX - press.x, event.clientY - press.y) < 14;
  const quick = event.timeStamp - press.at < 350;
  press = null;
  if (!still || !quick) return;
  if (event.timeStamp - lastTap.at < 340 && Math.hypot(event.clientX - lastTap.x, event.clientY - lastTap.y) < 48) {
    lastTap.at = -1e9;
    toggleControls();
  } else {
    lastTap = { at: event.timeStamp, x: event.clientX, y: event.clientY };
  }
}

function showVisNote(now) {
  const silent = vis.playing && now - vis.lastSound > 5000;
  const text = vis.error || (silent ? 'No sound is reaching the visualizer. On the Mac, allow System Audio Recording in Privacy & Security.' : '');
  if ($('vis-note').textContent !== text) $('vis-note').textContent = text;
  $('vis-note').hidden = !text;
}

function blendPalette(dt) {
  const blend = Math.min(1, dt * 1.6);
  for (const name of ['voice', 'music', 'deep']) {
    palette[name] = palette[name].map((value, i) => value + (palette.goal[name][i] - value) * blend);
  }
}

// --- Kolam ------------------------------------------------------------------------
// The patterns drawn at South Indian doorsteps: lines looping around a grid of dots, with
// four-way symmetry. Each verse gets its own pattern, drawn while it is sung.

let visStyle = ['kolam', 'words'].includes(store(s => s.getItem('vis:style'))) ? store(s => s.getItem('vis:style')) : 'rings';
const kolam = { key: null, cache: new Map(), groups: [], groupsKey: '', shown: -1, current: null, previous: null, fade: 0, waves: [], lastBeat: 0 };

function seeded(text) {
  let h = 1779033703 ^ text.length;
  for (let i = 0; i < text.length; i++) { h = Math.imul(h ^ text.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  return () => {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };
}

// A mirror curve: the line runs diagonally between the midpoints of the cells around each dot,
// passing straight through or bouncing off mirrors. Mirrors are placed symmetrically, so the
// whole pattern has the symmetry of a square. Each pattern also picks its own shape (square,
// diamond or cross), size, how tangled it is, how round its loops are, and how it is drawn.
function buildKolam(seedText) {
  const random = seeded(seedText);
  const roll = random();
  const shape = roll < .42 ? 'square' : roll < .74 ? 'diamond' : 'cross';
  const n = shape === 'square' ? 5 + Math.floor(random() * 4) : 6 + Math.floor(random() * 4), N = n * 2;
  const density = .15 + random() * .45;
  const arm = n % 2 ? 2 : 3;
  const inside = (x, y) => {
    if (x < 1 || y < 1 || x > N - 1 || y > N - 1) return false;
    const dx = Math.abs(x - n), dy = Math.abs(y - n);
    if (shape === 'diamond') return dx + dy <= n - (n % 2);
    if (shape === 'cross') return dx <= arm || dy <= arm;
    return true;
  };
  const decided = new Map();
  const mirrored = (x, y) => {
    const [a, b] = x % 2 === 0 ? [[x - 1, y], [x + 1, y]] : [[x, y - 1], [x, y + 1]];
    if (!inside(...a) || !inside(...b)) return true;   // the outline of the shape is always a mirror
    const key = [[x, y], [N - x, y], [x, N - y], [N - x, N - y], [y, x], [N - y, x], [y, N - x], [N - y, N - x]]
      .map(p => p.join(',')).sort()[0];
    if (!decided.has(key)) decided.set(key, random() < density);
    return decided.get(key);
  };
  const used = new Set();
  const segment = (x, y, dx, dy) => { const a = `${x},${y}`, b = `${x + dx},${y + dy}`; return a < b ? a + '|' + b : b + '|' + a; };
  const loops = [];
  for (let y = 0; y <= N; y++) {
    for (let x = 0; x <= N; x++) {
      if ((x + y) % 2 === 0) continue;
      for (const [dx, dy] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
        const cell = x % 2 === 0 ? [x + dx, y] : [x, y + dy];
        if (x + dx < 0 || x + dx > N || y + dy < 0 || y + dy > N || !inside(...cell) || used.has(segment(x, y, dx, dy))) continue;
        const points = [];
        let px = x, py = y, ddx = dx, ddy = dy;
        for (let guard = 0; guard < 4 * N * N + 8; guard++) {
          used.add(segment(px, py, ddx, ddy));
          points.push([px, py]);
          px += ddx;
          py += ddy;
          if (mirrored(px, py)) { if (px % 2 === 0) ddx = -ddx; else ddy = -ddy; }
          if (px === x && py === y && ddx === dx && ddy === dy) break;
        }
        loops.push(points);
      }
    }
  }
  const bulge = random() * .55;   // how far each bounce swings out into a round loop
  const dots = [];
  for (let y = 1; y < N; y += 2) for (let x = 1; x < N; x += 2) if (inside(x, y)) dots.push([x, y]);
  const look = random();
  return {
    n,
    dots,
    turn: shape === 'square' && random() < .3 ? Math.PI / 4 : 0,
    double: random() < .4,
    dotStyle: look < .5 ? 'dot' : look < .75 ? 'ring' : 'none',
    tint: random() < .6 ? 0 : random() < .5 ? 1 : 2,
    loops: loops.map(points => {
      const m = points.length, out = [];
      for (let i = 0; i < m; i++) {   // rounds each bounce into a curve, the way a hand draws it
        const p0 = points[(i - 1 + m) % m], p1 = points[i], p2 = points[(i + 1) % m];
        const a = [(p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2], b = [(p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2];
        const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
        const control = [p1[0] + (p1[0] - mid[0]) * bulge, p1[1] + (p1[1] - mid[1]) * bulge];
        for (let step = 0; step < 6; step++) {
          const t = step / 6, u = 1 - t;
          out.push([(u * u * a[0] + 2 * u * t * control[0] + t * t * b[0]) / N, (u * u * a[1] + 2 * u * t * control[1] + t * t * b[1]) / N]);
        }
      }
      const top = out.reduce((best, p, i) => (p[1] < out[best][1] ? i : best), 0);
      const pts = [...out.slice(top), ...out.slice(0, top)];
      pts.push(pts[0]);
      const cum = [0];
      for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
      return { pts, cum, total: cum[cum.length - 1] };
    }),
  };
}

// Verses: lines that follow on from each other, at most four to a pattern.
function kolamGroups() {
  const key = `${view.key}:${view.lines.length}`;
  if (kolam.groupsKey === key) return kolam.groups;
  const lines = view.lines.filter(line => line.text && line.text.trim());
  const groups = [];
  let group = null;
  lines.forEach((line, i) => {
    const next = lines[i + 1];
    const end = Math.min(next ? next.t : line.t + 5, line.t + 6);
    if (!group || line.t - group.end >= 2.5 || group.count >= 4) { group = { start: line.t, end, count: 0 }; groups.push(group); }
    group.end = end;
    group.count++;
  });
  kolam.groupsKey = key;
  kolam.groups = groups;
  return groups;
}

function drawKolam(dt) {
  const canvas = $('kolam');
  const scale = Math.min(2, devicePixelRatio || 1);
  const W = Math.round(canvas.clientWidth * scale), H = Math.round(canvas.clientHeight * scale);
  if (!W || !H) return;
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
  const c = canvas.getContext('2d');
  const { voice, music, deep } = palette, calm = calmMotion.matches;

  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalAlpha = 1;
  c.shadowBlur = 0;
  const ground = c.createRadialGradient(W / 2, H * .42, 0, W / 2, H * .42, Math.max(W, H) * .8);
  ground.addColorStop(0, cssColor(deep.map(v => Math.min(1, v * 2.2))));
  ground.addColorStop(1, cssColor(deep.map(v => v * .55)));
  c.fillStyle = ground;
  c.fillRect(0, 0, W, H);

  const stage = $('stage').getBoundingClientRect(), portrait = innerHeight >= innerWidth;
  const side = (portrait ? Math.min(stage.width * .94, stage.height * .63 - 52) : Math.min(stage.height - 52, stage.width * .48)) * scale;
  const left = portrait ? (stage.left + stage.width / 2) * scale - side / 2 : stage.left * scale;
  const top = portrait ? (stage.top + 46) * scale : (stage.top + 46 + (stage.height - 46) / 2) * scale - side / 2;
  const now = performance.now() / 1000, middleX = left + side / 2, middleY = top + side / 2;
  if (!calm && vis.kick > .55 && now - kolam.lastBeat > .28) { kolam.lastBeat = now; kolam.waves.push(now); }
  kolam.waves = kolam.waves.filter(born => now - born < 1.6);

  if (kolam.key !== view.key) Object.assign(kolam, { key: view.key, salt: Math.random().toString(36).slice(2), cache: new Map(), shown: -1, current: null, previous: null, fade: 0 });
  const t = Math.max(0, position()) + view.offset;
  const groups = kolamGroups();
  let index = 0, progress = 0;
  if (groups.length) {
    groups.forEach((group, i) => { if (group.start <= t) index = i; });
    const group = groups[index];
    progress = t < group.start ? 0 : (t - group.start) / Math.max(1, group.end - group.start) * 1.04;
  } else {
    index = Math.floor(t / 24);
    progress = (t % 24) / 20;
  }
  progress = Math.min(1, Math.max(0, progress));
  const seedKey = `${view.key}:${kolam.salt}:${index}`;
  if (!kolam.cache.has(seedKey)) kolam.cache.set(seedKey, buildKolam(seedKey));
  if (index !== kolam.shown) {
    if (kolam.current) { kolam.previous = kolam.current.pattern; kolam.fade = 1; }
    kolam.shown = index;
  }
  kolam.current = { pattern: kolam.cache.get(seedKey) };
  kolam.fade = Math.max(0, kolam.fade - dt * 1.1);

  const cream = 'rgb(246 240 228)';
  const hollow = cssColor(deep.map(v => Math.min(1, v * 2)));
  const glow = cssColor(music);
  // Three passes over the drawn part of each line: a soft glow, the line itself, and for the
  // pattern being drawn, bright streaks that race along it faster as the music gets louder.
  const drawLines = (pattern, amount, alpha, grow, streaks) => {
    const unit = side / (pattern.n * 2), heads = [];
    const at = ([x, y]) => [middleX + (left + x * side - middleX) * grow, middleY + (top + y * side - middleY) * grow];
    const ink = pattern.tint === 1 ? cssColor(voice) : pattern.tint === 2 ? cssColor(music.map(v => v + (1 - v) * .45)) : cream;
    const weight = unit * (pattern.double ? .16 : .085) + unit * vis.vocal * .03;
    const passes = [[unit * .3, glow, .22, false], [weight, ink, .9 + vis.kick * .1, false]];
    if (pattern.double) passes.push([weight * .42, hollow, 1, false]);   // the traditional double line
    if (streaks && !calm) passes.push([unit * .14, cssColor(voice), .3 + vis.energy * .7, true]);
    c.lineCap = 'round';
    c.lineJoin = 'round';
    for (const [width, colour, opacity, dashed] of passes) {
      c.strokeStyle = colour;
      c.lineWidth = width * grow;
      c.globalAlpha = alpha * opacity;
      c.setLineDash(dashed ? [unit * .9, unit * 5.5] : []);
      c.lineDashOffset = dashed ? -now * unit * (2.2 + vis.energy * 9) : 0;
      for (const loop of pattern.loops) {
        const target = amount * loop.total;
        if (target <= 0) continue;
        c.beginPath();
        c.moveTo(...at(loop.pts[0]));
        let i = 1;
        for (; i < loop.pts.length && loop.cum[i] <= target; i++) c.lineTo(...at(loop.pts[i]));
        if (i < loop.pts.length) {
          const f = (target - loop.cum[i - 1]) / Math.max(1e-6, loop.cum[i] - loop.cum[i - 1]);
          const a = loop.pts[i - 1], b = loop.pts[i];
          const end = at([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]);
          c.lineTo(...end);
          if (colour === ink) heads.push(end);
        }
        c.stroke();
      }
    }
    c.setLineDash([]);
    return heads;
  };

  // The whole pattern sways a little and breathes with the music.
  c.save();
  if (!calm) {
    c.translate(middleX, middleY);
    c.rotate(Math.sin(now * .23) * .05 + vis.kick * .012);
    const breathe = 1 + vis.energy * .035;
    c.scale(breathe, breathe);
    c.translate(-middleX, -middleY);
  }
  const turned = kolam.current.pattern.turn;
  if (turned) {   // a square set on its point, shrunk to stay inside the same space
    c.translate(middleX, middleY);
    c.rotate(turned);
    c.scale(.72, .72);
    c.translate(-middleX, -middleY);
  }
  if (kolam.previous && kolam.fade > 0) drawLines(kolam.previous, 1, kolam.fade * kolam.fade, calm ? 1 : 1 + (1 - kolam.fade) * .08, false);

  // The dots: the beat moves out from the centre; a finger lights the ones under it.
  const pattern = kolam.current.pattern, N = pattern.n * 2, unit = side / N;
  c.fillStyle = cream;
  c.strokeStyle = cream;
  c.lineWidth = unit * .025;
  for (const [x, y] of pattern.dots) {
    {
      const px = left + x * unit, py = top + y * unit;
      const reach = Math.hypot(x - N / 2, y - N / 2) / (N / 2);
      let lit = 0;
      for (const born of kolam.waves) {   // each beat sends a ring of light out through the dots
        const front = (now - born) * 1.1;
        lit = Math.max(lit, Math.exp(-((reach - front) ** 2) / .012) * (1 - (now - born) / 1.6));
      }
      for (const touch of touches) if (touch.down && Math.hypot(px - touch.x * W, py - (1 - touch.y) * H) < unit * 1.7) lit = 1;
      const resting = pattern.dotStyle === 'none' ? 0 : .42;
      c.globalAlpha = resting + lit * .55;
      if (c.globalAlpha < .02) continue;
      c.beginPath();
      if (pattern.dotStyle === 'ring' && lit < .3) {
        c.arc(px, py, unit * .11, 0, Math.PI * 2);
        c.stroke();
      } else {
        c.arc(px, py, unit * (.06 + lit * .05), 0, Math.PI * 2);
        c.fill();
      }
    }
  }

  const heads = drawLines(pattern, progress, 1, 1, true);
  c.fillStyle = cssColor(voice);
  c.shadowColor = cssColor(voice);
  c.shadowBlur = unit * (.5 + vis.vocal * .9);
  c.globalAlpha = 1;
  for (const [x, y] of heads) {
    c.beginPath();
    c.arc(x, y, unit * (.07 + vis.vocal * .06), 0, Math.PI * 2);
    c.fill();
  }
  c.shadowBlur = 0;
  c.restore();
}

// --- Words ------------------------------------------------------------------------
// The sung word lands big, then flies off to rest somewhere on the screen, smaller and in
// the album's colours, so the song builds up into a poster of itself as it plays.

const kin = { key: null, settled: [], active: null, activeKey: '', font: '' };

function wordsArea(scale) {
  const stage = $('stage').getBoundingClientRect(), portrait = innerHeight >= innerWidth;
  const area = portrait
    ? { x: stage.left + 4, y: stage.top + 46, w: stage.width - 8, h: stage.height - 52 }
    : { x: stage.left, y: stage.top + 46, w: stage.width, h: stage.height - 52 };
  return { x: area.x * scale, y: area.y * scale, w: area.w * scale, h: area.h * scale };
}

function settleWord(word, area, now, c) {
  const random = Math.random;
  const size = Math.min(area.w, area.h * 1.2) * (.045 + random() * .06);   // small enough to pile up without a jumble
  const rot = random() < .2 ? (random() < .5 ? -1 : 1) * Math.PI / 2 : 0;
  c.font = `800 ${size}px ${kin.font}`;
  const across = c.measureText(word.text).width, tall = size * .95;
  const bw = rot ? tall : across, bh = rot ? across : tall;
  let best = null, least = Infinity;
  for (let k = 0; k < 14; k++) {   // the emptiest of a few random spots
    const x = area.x + bw / 2 + random() * Math.max(1, area.w - bw), y = area.y + bh / 2 + random() * Math.max(1, area.h - bh);
    // Keep clear of the middle, where the word being sung lands.
    const middleW = area.w * .3, middleH = area.h * .2, middleX = area.x + area.w / 2, middleY = area.y + area.h / 2;
    let overlap = 4 * Math.max(0, Math.min(x + bw / 2, middleX + middleW) - Math.max(x - bw / 2, middleX - middleW))
      * Math.max(0, Math.min(y + bh / 2, middleY + middleH) - Math.max(y - bh / 2, middleY - middleH));
    for (const other of kin.settled.slice(-24)) {
      overlap += Math.max(0, Math.min(x + bw / 2, other.x + other.bw / 2) - Math.max(x - bw / 2, other.x - other.bw / 2))
        * Math.max(0, Math.min(y + bh / 2, other.y + other.bh / 2) - Math.max(y - bh / 2, other.y - other.bh / 2));
    }
    if (overlap < least) { least = overlap; best = { x, y }; }
  }
  const colours = [[.965, .94, .89], palette.voice, palette.music.map(v => v + (1 - v) * .35)];
  kin.settled.push({
    text: word.text, from: { x: word.x, y: word.y, size: word.size }, x: best.x, y: best.y, size, rot, bw, bh,
    t0: now, alpha: .32 + random() * .28, colour: cssColor(colours[Math.floor(random() * 3)]), wobble: random(),
  });
  if (kin.settled.length > 32) kin.settled.splice(0, kin.settled.length - 32);
}

function drawWords() {
  const canvas = $('kolam'), scale = Math.min(2, devicePixelRatio || 1);
  const W = Math.round(canvas.clientWidth * scale), H = Math.round(canvas.clientHeight * scale);
  if (!W || !H) return;
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
  const c = canvas.getContext('2d'), { voice, deep } = palette, calm = calmMotion.matches;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalAlpha = 1;
  c.shadowBlur = 0;
  const ground = c.createRadialGradient(W / 2, H * .4, 0, W / 2, H * .4, Math.max(W, H) * .8);
  ground.addColorStop(0, cssColor(deep.map(v => Math.min(1, v * 2.2))));
  ground.addColorStop(1, cssColor(deep.map(v => v * .55)));
  c.fillStyle = ground;
  c.fillRect(0, 0, W, H);

  const now = performance.now() / 1000, area = wordsArea(scale);
  if (kin.key !== view.key) Object.assign(kin, { key: view.key, settled: [], active: null, activeKey: '' });
  if (!kin.font) kin.font = getComputedStyle(document.body).fontFamily;

  // Follow the word being sung in the line below.
  const els = [...$('vis-line').querySelectorAll('.word')];
  const index = els.findIndex(el => el.classList.contains('active'));
  const key = index >= 0 ? `${view.active}:${index}` : '';
  if (key !== kin.activeKey) {
    if (kin.active && kin.active.size) settleWord(kin.active, area, now, c);
    const text = index >= 0 ? els[index].textContent.replace(/[.,!?;:"“”()]+/g, '').trim() : '';
    kin.active = text ? { text, born: now } : null;
    kin.activeKey = key;
  }

  c.textAlign = 'center';
  c.textBaseline = 'middle';
  const total = kin.settled.length;
  kin.settled.forEach((word, i) => {
    const p = calm ? 1 : Math.min(1, (now - word.t0) / .9), e = 1 - (1 - p) ** 3;
    const x = word.from.x + (word.x - word.from.x) * e, y = word.from.y + (word.y - word.from.y) * e;
    const size = word.from.size + (word.size - word.from.size) * e;
    const age = (total - 1 - i) / 28;
    c.save();
    c.translate(x, y);
    c.rotate(word.rot * e);
    if (!calm) c.scale(1 + vis.kick * .06 * word.wobble, 1 + vis.kick * .06 * word.wobble);
    c.globalAlpha = (1 - e) + e * word.alpha * Math.max(.15, 1 - age);
    c.fillStyle = word.colour;
    c.font = `800 ${size}px ${kin.font}`;
    c.fillText(word.text, 0, 0);
    c.restore();
  });

  const word = kin.active;
  if (word) {
    c.font = `800 100px ${kin.font}`;
    const width = c.measureText(word.text).width || 1;
    const size = Math.min(area.w * .86 / (width / 100), area.h * .34, 160 * scale);
    const p = calm ? 1 : Math.min(1, (now - word.born) / .35), e = 1 - (1 - p) ** 3;
    const grow = (1 + .35 * (1 - e)) * (1 + vis.vocal * .07);
    Object.assign(word, { x: area.x + area.w / 2, y: area.y + area.h * .5, size: size * grow });
    c.save();
    c.globalAlpha = e;
    c.fillStyle = 'rgb(246 244 239)';
    c.shadowColor = cssColor(voice);
    c.shadowBlur = 24 * scale * (.3 + vis.vocal);
    c.font = `800 ${word.size}px ${kin.font}`;
    c.fillText(word.text, word.x, word.y);
    c.restore();
  }
}

function setVisStyle(name) {
  visStyle = name;
  store(s => s.setItem('vis:style', name));
  showVisStyle(true);
}

const VIS_STYLES = ['rings', 'kolam', 'words'];
let pagerAt = null, pagerTimer = 0;

function showVisStyle(announce) {
  document.body.classList.toggle('paper-on', visStyle !== 'rings');
  $('stage').classList.toggle('kolam', visStyle === 'kolam');
  $('stage').classList.toggle('words', visStyle === 'words');
  for (const button of $('vis-pager').querySelectorAll('button')) button.setAttribute('aria-selected', button.dataset.style === visStyle);
  fitVisLine();
  placePager(announce);
  if (announce) wakePager();
}

function wakePager() {
  $('vis-pager').classList.add('awake');
  clearTimeout(pagerTimer);
  pagerTimer = setTimeout(() => $('vis-pager').classList.remove('awake'), 3500);
}

// The drop sits on the current style. While a finger drags sideways it stretches toward the
// style it would land on, or barely gives at the end of the row.
function placePager(animated, drag = 0) {
  const pager = $('vis-pager'), drop = pager.querySelector('.drop');
  const buttons = [...pager.querySelectorAll('button')];
  const index = VIS_STYLES.indexOf(visStyle), on = buttons[index];
  if (!on || !on.offsetWidth) return;
  let x = on.offsetLeft, w = on.offsetWidth;
  if (drag) {
    const target = buttons[index + Math.sign(drag)], pull = Math.min(1, Math.abs(drag));
    if (!target) {
      x += Math.sign(drag) * pull * 6;
    } else if (target.offsetLeft > x) {
      w += (target.offsetLeft + target.offsetWidth - x - w) * pull * .55;
    } else {
      const reach = (x - target.offsetLeft) * pull * .55;
      x -= reach;
      w += reach;
    }
  }
  drop.style.width = w + 'px';
  drop.style.transform = `translateX(${x}px)` + (drag ? ` scaleY(${1 - Math.min(1, Math.abs(drag)) * .14})` : '');
  if (animated && pagerAt && !calmMotion.matches && (pagerAt.x !== x || pagerAt.w !== w)) {
    drop.animate([
      { transform: `translateX(${pagerAt.x}px)`, width: pagerAt.w + 'px' },
      { transform: `translateX(${x}px)`, width: w + 'px' },
    ], { duration: 420, easing: 'cubic-bezier(.22, 1, .36, 1)' });
  }
  pagerAt = { x, w };
}

function drawVis(now) {
  if (!visWanted()) { vis.running = false; return; }
  requestAnimationFrame(drawVis);
  if (!vis.playing && !touches.length && !vis.ripples.length && now - vis.last < 100) return;   // no need to run hard while paused
  const dt = Math.min(.1, (now - vis.last) / 1000);
  vis.last = now;
  vis.time += dt;
  vis.spin += calmMotion.matches ? 0 : dt * (.05 + vis.vocal * .12);
  showVisNote(now);
  showVisLine();
  readMusic(now, dt);
  blendPalette(dt);
  if (visStyle !== 'rings') {
    if (visStyle === 'kolam') drawKolam(dt); else drawWords();
    for (let i = touches.length - 1; i >= 0; i--) if (!touches[i].down) touches.splice(i, 1);
    return;
  }
  if (!scene.gl || !scene.w) return;
  drawInk(dt);
  stepField(dt);
  showField(dt);
}

function fillLine(li, text) {
  li.dataset.text = text.trim();
  for (const part of ['original', 'roman', 'english']) {
    const span = document.createElement('span');
    span.className = part;
    span.dir = 'auto';
    if (part === 'original') setWords(span, text);
    li.append(span);
  }
}

function applyExtras() {
  let any = false;
  for (const li of $('lines').children) {
    if (!li.dataset.text) continue;
    const roman = view.roman[li.dataset.text] || '';
    const english = (extras.natural && view.natural[li.dataset.text]) || view.english[li.dataset.text] || '';
    const romanLine = li.querySelector('.roman');
    if (romanLine.textContent !== roman) setWords(romanLine, roman);
    li.querySelector('.english').textContent = english;
    if ((roman && extras.roman) || (english && extras.english)) any = true;
  }
  $('stage').classList.toggle('extras', any && view.plain);
  view.hasExtras = any;
  syncSplit();
  placeActive(true);
}

function syncSplit() {
  const split = activeTab === 'lyrics' && view.lines.length > 0 && (view.hasExtras || ((view.translating || view.naturalizing) && extras.english));
  const was = $('now').classList.contains('split');
  $('now').classList.toggle('split', split);
  $('gloss').hidden = !split;
  if (split) showGloss();
  if (split !== was) placeActive(true);
}

function showGloss() {
  const line = view.lines[view.active];
  const original = line && line.text ? line.text.trim() : '';
  const roman = extras.roman ? view.roman[original] || '' : '';
  const english = extras.english ? (extras.natural && view.natural[original]) || view.english[original] || '' : '';
  const romanLine = $('gloss-roman'), englishLine = $('gloss-english');
  const waiting = view.translating || (view.naturalizing && extras.natural);
  if (!view.translating && waiting) $('gloss-wait-text').textContent = 'Writing a natural translation…';
  $('gloss-wait').hidden = !(waiting && extras.english);
  const changed = romanLine.textContent !== roman || englishLine.textContent !== english;
  if (!changed) return;
  if (romanLine.textContent !== roman) setWords(romanLine, roman);
  englishLine.textContent = english;
  const gloss = $('gloss');
  let scale = 1;
  gloss.style.setProperty('--gs', scale);
  while (scale > .6 && gloss.scrollHeight > gloss.clientHeight + 1) {
    scale -= .08;
    gloss.style.setProperty('--gs', scale);
  }
  if (roman || english) gloss.animate({ opacity: [.25, 1] }, { duration: 220, easing: 'ease-out' });
}

function showExtras() {
  document.body.classList.toggle('no-roman', !extras.roman);
  document.body.classList.toggle('no-english', !extras.english);
  $('show-roman').setAttribute('aria-pressed', extras.roman);
  const mode = !extras.english ? 'off' : extras.natural ? 'natural' : 'literal';
  for (const button of document.querySelectorAll('#timing .english button')) button.setAttribute('aria-checked', button.dataset.english === mode);
  placeEnglishDrop(true);
}

let englishAt = null;

// Off, word for word, or written for meaning. Turning English off keeps the Natural choice for next time.
function setEnglish(mode) {
  extras.english = mode !== 'off';
  if (mode !== 'off') extras.natural = mode === 'natural';
  store(s => { s.setItem('show:english', extras.english ? '1' : '0'); s.setItem('show:natural', extras.natural ? '1' : '0'); });
  if (extras.english && extras.natural && view.key) loadNatural(view.key);
  showExtras();
  applyExtras();
  revealTiming();
}

function placeEnglishDrop(animated) {
  const group = document.querySelector('#timing .english'), drop = group.querySelector('.drop');
  const on = group.querySelector('[aria-checked="true"]');
  if (!on || !on.offsetWidth) return;
  const x = on.offsetLeft, w = on.offsetWidth;
  drop.style.width = w + 'px';
  drop.style.transform = `translateX(${x}px)`;
  if (animated && englishAt && englishAt.x !== x && !calmMotion.matches) {
    const left = Math.min(englishAt.x, x), span = Math.max(englishAt.x + englishAt.w, x + w) - left;
    drop.animate([
      { transform: `translateX(${englishAt.x}px)`, width: englishAt.w + 'px' },
      { transform: `translateX(${left}px) scaleY(.8)`, width: span + 'px', offset: .42 },
      { transform: `translateX(${x}px)`, width: w + 'px' },
    ], { duration: 460, easing: 'cubic-bezier(.22, 1, .36, 1)' });
  }
  englishAt = { x, w };
}

function toggleExtra(name) {
  extras[name] = name === 'natural' ? !(extras.natural && extras.english) : !extras[name];
  if (name === 'natural' && extras.natural && !extras.english) {   // natural English needs English shown
    extras.english = true;
    store(s => s.setItem('show:english', '1'));
  }
  store(s => s.setItem('show:' + name, extras[name] ? '1' : '0'));
  if (name === 'natural' && extras.natural && view.key) loadNatural(view.key);
  showExtras();
  applyExtras();
  revealTiming();
}

function setTranslating(on) {
  if (view.translating === on) return;
  view.translating = on;
  syncSplit();
}

async function loadTranslation(key) {
  let wait = 60000;
  try {
    const res = await fetch('/api/translation?key=' + key, { cache: 'no-store' });
    const data = await res.json();
    if (view.key !== key) return;
    $('gloss-wait-text').textContent = data.status === 'failed' ? 'Translation is taking a moment…' : 'Translating…';
    setTranslating(data.status === 'loading' || data.status === 'failed');
    if (data.status === 'ready') { view.english = data.lines; applyExtras(); if (extras.natural) loadNatural(key); return; }
    if (data.status === 'none') return;
    wait = data.status === 'loading' ? 1500 : 15000;
  } catch {
    wait = 15000;
    if (view.key === key) setTranslating(true);
  }
  if (view.key === key) setTimeout(() => loadTranslation(key), wait);
}

function setNaturalizing(on) {
  if (view.naturalizing === on) return;
  view.naturalizing = on;
  syncSplit();
  showGloss();
}

// The meaning-first translation, written on the Mac. The literal one stays up until it arrives.
async function loadNatural(key) {
  clearTimeout(view.naturalTimer);
  if (view.key !== key || !extras.natural || Object.keys(view.natural).length) return;
  let wait = 0;
  try {
    const res = await fetch(`/api/translation?key=${key}&style=natural`, { cache: 'no-store' });
    const data = await res.json();
    if (view.key !== key) return;
    if (data.status === 'ready') { view.natural = data.lines; setNaturalizing(false); applyExtras(); return; }
    if (data.status === 'loading') wait = 2000;
    else if (data.status === 'failed') wait = 30000;
  } catch { wait = 15000; }
  setNaturalizing(wait === 2000);
  if (wait && view.key === key && extras.natural) view.naturalTimer = setTimeout(() => loadNatural(key), wait);
}

// --- Tidbits -------------------------------------------------------------------

async function loadTidbits() {
  if (activeTab !== 'tidbits' || !view.key) return;
  const key = view.key;
  clearTimeout(tidbit.timer);
  if (tidbit.key !== key) {
    Object.assign(tidbit, { key, status: 'loading', items: [], index: 0, shown: 0, step: 0, steps: 4, stepAt: performance.now(), label: 'Looking up the song' });
    paintTidbits();
  } else if (tidbit.status === 'ready' || tidbit.status === 'none') {
    return;
  }
  let wait = 20000;
  try {
    const res = await fetch('/api/tidbits?key=' + key, { cache: 'no-store' });
    const data = await res.json();
    if (tidbit.key !== key) return;
    tidbit.status = data.status;
    if (data.status === 'loading') {
      if (data.step !== tidbit.step) { tidbit.step = data.step; tidbit.stepAt = performance.now(); }
      tidbit.steps = data.steps;
      tidbit.label = data.label;
      wait = 500;
    } else if (data.status === 'ready') {
      tidbit.items = data.items;
    }
    paintTidbits();
    if (data.status === 'ready' || data.status === 'none') return;
  } catch {
    if (tidbit.key !== key) return;
    tidbit.status = 'failed';
    paintTidbits();
  }
  tidbit.timer = setTimeout(loadTidbits, wait);
}

function syncFlood() {
  const on = activeTab === 'tidbits' && onScreen() && tidbit.status === 'ready' && tidbit.items.length > 0;
  document.body.classList.toggle('tb-on', on);
  $('now').classList.toggle('on-light', on && !!tidbit.light);
}

function paintTidbits() {
  const loading = tidbit.status === 'loading', ready = tidbit.status === 'ready' && tidbit.items.length > 0;
  $('tb-load').hidden = !loading;
  $('tb-show').hidden = !ready;
  $('tb-note').hidden = loading || ready;
  if (loading) $('tb-label').textContent = tidbit.label;
  if (!loading && !ready) {
    $('tb-note').textContent = tidbit.status === 'failed' ? "Couldn't look this one up. Trying again soon." : 'No stories about this song yet.';
  }
  if (ready && !$('tb-head').textContent) showTidbit(0);
  if (!ready) { $('tb-head').textContent = ''; $('tb-text').textContent = ''; $('tb-dots').textContent = ''; $('tb-flood').textContent = ''; }
  syncFlood();
}

const lightness = ([r, g, b]) => {
  const linear = v => (v <= .04045 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4);
  return .2126 * linear(r) + .7152 * linear(g) + .0722 * linear(b);
};
const cssColor = rgb => `rgb(${rgb.map(v => Math.round(v * 255)).join(' ')})`;

function floodTo(colour) {
  const flood = $('tb-flood'), layer = document.createElement('div');
  layer.className = 'tb-layer';
  layer.style.background = cssColor(colour);
  if (view.art) {
    const picture = document.createElement('i');
    picture.style.backgroundImage = `url("/art?id=${view.art}")`;
    layer.append(picture);
    if (!calmMotion.matches) picture.animate({ transform: ['scale(1.16)', 'scale(1)'] }, { duration: tidbit.dwell * 1000, easing: 'linear', fill: 'forwards' });
  }
  flood.append(layer);
  const reveal = calmMotion.matches ? { opacity: [0, 1] } : { clipPath: ['circle(0% at 14% 86%)', 'circle(150% at 14% 86%)'] };
  layer.animate(reveal, { duration: 640, easing: 'cubic-bezier(.16, 1, .3, 1)' }).onfinish = () => {
    while (layer.previousSibling) layer.previousSibling.remove();
  };
}

function setHeadline(element, text) {
  element.textContent = '';
  text.split(/\s+/).forEach((part, i) => {
    const mask = document.createElement('span'), word = document.createElement('b');
    mask.className = 'tb-w';
    word.textContent = part;
    mask.append(word);
    element.append(mask, ' ');
    if (!calmMotion.matches) {
      word.animate({ transform: ['translateY(115%)', 'none'] }, { duration: 620, delay: 90 + i * 60, easing: 'cubic-bezier(.16, 1, .3, 1)', fill: 'backwards' });
    }
  });
}

function showTidbit(index) {
  const item = tidbit.items[index], head = $('tb-head'), text = $('tb-text');
  const { voice, music } = palette.goal;
  const funny = item.kind === 'funny', second = index % 2 === 1;
  const ground = funny ? voice : music.map(v => v * (second ? .62 : .2));
  tidbit.index = index;
  tidbit.shown = 0;
  tidbit.dwell = Math.max(8, 5 + (item.headline + ' ' + item.text).split(/\s+/).length * .34);
  tidbit.light = lightness(ground) > .22;
  floodTo(ground);
  syncFlood();

  setHeadline(head, item.headline || item.text);
  head.classList.toggle('tilt', funny);
  head.style.color = !funny && !second && !tidbit.light ? cssColor(voice) : '';
  text.textContent = item.headline ? item.text : '';
  $('tb-source').textContent = 'From Wikipedia: ' + item.source;
  $('tb-dots').textContent = '';
  for (let i = 0; i < tidbit.items.length; i++) {
    const dot = document.createElement('i'), bar = document.createElement('b');
    if (i < index) bar.style.transform = 'scaleX(1)';
    dot.append(bar);
    $('tb-dots').append(dot);
  }

  head.style.fontSize = '';
  let size = parseFloat(getComputedStyle(head).fontSize);
  while (size > 24 && ($('tb-show').offsetHeight > $('stage').clientHeight * .96 || head.scrollWidth > head.clientWidth + 1)) {
    size -= 2;
    head.style.fontSize = size + 'px';
  }
  if (!calmMotion.matches && item.headline) {
    text.animate({ opacity: [0, 1], transform: ['translateY(12px)', 'none'] }, { duration: 460, delay: 320, easing: 'cubic-bezier(.16, 1, .3, 1)', fill: 'backwards' });
  }
}

function tickTidbits() {
  if (activeTab !== 'tidbits' || document.hidden) return;
  if (tidbit.status === 'loading') {
    // Real steps from the server, with an honest creep inside the current step.
    const creep = 1 - Math.exp(-(performance.now() - tidbit.stepAt) / (tidbit.step === tidbit.steps - 1 ? 7000 : 1400));
    $('tb-fill').style.transform = `scaleX(${(tidbit.step + creep * .92) / tidbit.steps})`;
  } else if (tidbit.status === 'ready' && tidbit.items.length) {
    tidbit.shown += .1;
    const bar = $('tb-dots').children[tidbit.index]?.firstChild;
    if (bar) bar.style.transform = `scaleX(${Math.min(1, tidbit.shown / tidbit.dwell)})`;
    if (tidbit.shown >= tidbit.dwell) showTidbit((tidbit.index + 1) % tidbit.items.length);
  }
}

function renderSynced(lines) {
  clearLyrics();
  note('');
  const list = [...lines];
  if (!list.length || list[0].t > 4) list.unshift({ t: 0, text: '' });
  view.lines = list;
  const frag = document.createDocumentFragment();
  for (const line of list) {
    const li = document.createElement('li');
    li.dir = 'auto';
    if (line.text) fillLine(li, line.text);
    else { li.textContent = '•••'; li.className = 'gap'; }
    frag.append(li);
  }
  $('lines').append(frag);
}

function renderPlain(text) {
  clearLyrics();
  note('');
  view.plain = true;
  $('stage').classList.add('plain');
  const frag = document.createDocumentFragment();
  for (const row of text.split('\n')) {
    if (!row.trim()) continue;
    const li = document.createElement('li');
    li.dir = 'auto';
    fillLine(li, row);
    frag.append(li);
  }
  $('lines').append(frag);
}

function currentIndex(t) {
  const lines = view.lines;
  let lo = 0, hi = lines.length - 1, found = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (lines[mid].t <= t) { found = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return found;
}

function placeActive(force) {
  const items = $('lines').children;
  const li = items[view.active];
  if (!li) return;
  const anchor = $('stage').clientHeight * 0.4;
  const y = Math.round(anchor - li.offsetTop - li.offsetHeight / 2);
  if (force) {
    $('lines').style.transition = 'none';
    $('lines').style.transform = `translateY(${y}px)`;
    $('lines').offsetHeight;
    $('lines').style.transition = '';
  } else {
    $('lines').style.transform = `translateY(${y}px)`;
  }
}

// The old line lifts away while its light is still drifting; the new one comes into focus.
function showVisLine() {
  const element = $('vis-line');
  const line = view.lines[view.active];
  const original = line && line.text ? line.text.trim() : '';
  const text = view.roman[original] || original;
  if (element.textContent === text) return;

  const calm = calmMotion.matches;
  if (element.textContent) {
    const leaving = element.cloneNode(true);
    leaving.removeAttribute('id');
    leaving.className = 'vis-gone';
    leaving.setAttribute('aria-hidden', 'true');
    element.after(leaving);
    leaving.animate(calm ? [{ opacity: 1 }, { opacity: 0 }] : [
      { opacity: 1, filter: 'blur(0)', transform: 'none' },
      { opacity: 0, filter: 'blur(10px)', transform: 'translateY(-.28em) scale(1.03)' },
    ], { duration: 260, easing: 'ease-in', fill: 'forwards' }).onfinish = () => leaving.remove();
  }
  setWords(element, text);
  fitVisLine();
  if (text) {
    element.animate(calm ? [{ opacity: 0 }, { opacity: 1 }] : [
      { opacity: 0, filter: 'blur(14px)', transform: 'translateY(.22em) scale(.985)' },
      { opacity: 1, filter: 'blur(0)', transform: 'none' },
    ], { duration: 460, easing: 'cubic-bezier(.16, 1, .3, 1)' });
  }
}

const clockText = seconds => `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, '0')}`;

function drawSongMap() {
  const map = $('map');
  map.textContent = '';
  const lines = view.lines.filter(line => line.text);
  const blocks = [];
  lines.forEach((line, i) => {
    const next = lines[i + 1];
    const end = Math.min(next ? next.t : line.t + 5, line.t + 6);
    const last = blocks[blocks.length - 1];
    if (last && line.t - last.end < 2.5) last.end = end;
    else blocks.push({ start: line.t, end });
  });
  for (const block of blocks) {
    const stretch = document.createElement('i');
    stretch.style.left = Math.min(100, block.start / duration * 100) + '%';
    stretch.style.width = Math.max(0, (Math.min(duration, block.end) - block.start) / duration * 100) + '%';
    map.append(stretch);
  }
}

function tick() {
  const t = Math.max(0, position());
  tickTidbits();
  $('time').hidden = !duration;
  if (duration) {
    $('fill').style.transform = `scaleX(${Math.min(1, t / duration)})`;
    const second = Math.floor(t);
    if (second !== view.second) {
      view.second = second;
      $('elapsed').textContent = clockText(Math.min(t, duration));
      $('remain').textContent = '−' + clockText(Math.max(0, duration - t));
    }
    const mapKey = `${view.key}:${view.lines.length}:${Math.round(duration)}`;
    if (mapKey !== view.mapKey) { view.mapKey = mapKey; drawSongMap(); }
  }

  if (view.lines.length) {
    const next = currentIndex(t + view.offset);
    if (next !== view.active) {
      const first = view.active === -2;
      const items = $('lines').children;
      if (items[view.active]) items[view.active].classList.remove('current');
      const low = Math.min(view.active, next), high = Math.max(view.active, next);
      for (let i = Math.max(0, low); i <= high && i < items.length; i++) items[i].classList.toggle('past', i < next);
      if (first) for (let i = 0; i < next; i++) items[i].classList.add('past');
      view.active = next;
      if (items[next]) items[next].classList.add('current');
      placeActive(first);
      if (!$('gloss').hidden) showGloss();
    }
  } else if (view.plain && duration) {
    const room = Math.max(0, $('lines').scrollHeight - $('stage').clientHeight);
    // Hold the first and last bit of the song so the opening and ending stay readable.
    const progress = Math.min(1, Math.max(0, (t / duration - 0.08) / 0.84));
    const y = Math.round(-room * progress);
    if (y !== view.plainY) { view.plainY = y; $('lines').style.transform = `translateY(${y}px)`; }
  }
}

async function loadLyrics(key, status) {
  view.status = status;
  if (status === 'loading') { clearLyrics(); note('Finding lyrics…'); return; }
  if (status === 'none') { clearLyrics(); note('No lyrics found for this song.'); return; }
  if (status === 'instrumental') { clearLyrics(); note('Instrumental'); return; }
  if (status === 'needs_setup') { clearLyrics(); note('To sync lyrics for YouTube, turn on Allow JavaScript from Apple Events in Safari’s Developer settings.'); return; }
  if (status === 'error') { clearLyrics(); note("Can't reach the lyrics service. Trying again."); return; }
  try {
    const res = await fetch('/api/lyrics?key=' + key, { cache: 'no-store' });
    const data = await res.json();
    if (view.key !== key) return;
    if (data.status === 'synced') renderSynced(data.lines);
    else if (data.status === 'plain') renderPlain(data.text);
    view.roman = data.roman || {};
    applyExtras();
    loadTranslation(key);
    tick();
  } catch { view.status = null; }   // the next poll asks again
}

function showTrack(state) {
  const track = state.track;
  if (view.key !== track.key) {
    view.key = track.key;
    view.status = null;
    view.offset = loadOffset(track.key);
    $('title').textContent = track.name;
    $('artist').textContent = track.artist;
    clearLyrics();
    showOffset();
    $('tb-head').textContent = '';
    $('tb-flood').textContent = '';
    loadTidbits();
  }
  const art = state.art || null;
  if (art !== view.art) {
    view.art = art;
    const image = art ? `url("/art?id=${art}")` : '';
    $('art').style.backgroundImage = image;
    $('art').hidden = !art;
    $('backdrop').style.backgroundImage = image;
    $('backdrop').classList.toggle('on', !!art);
    loadPalette(art);
  }
  duration = track.duration || 0;
  if (view.status !== state.lyrics) loadLyrics(track.key, state.lyrics);
}

function screen(name) {
  const lyricsOn = name === 'now';
  $('now').hidden = !lyricsOn;
  $('idle').hidden = lyricsOn;
  if (!lyricsOn) $('backdrop').classList.remove('on');
  else if (view.art) $('backdrop').classList.add('on');
  syncLevels();
}

function apply(state, sent) {
  if (state.state === 'stopped' || state.state === 'unavailable') {
    clock.running = false;
    pausedSince = null;
    view.key = null;
    view.status = null;
    view.art = null;
    clearLyrics();
    $('idle-note').textContent = state.detail || '';
    $('idle-note').hidden = !state.detail;
    screen('idle');
    return;
  }
  $('idle-note').hidden = true;
  const playing = state.state === 'playing';
  const trip = (performance.now() - sent) / 1000;
  syncClock(state.position + (playing ? state.age + trip / 2 : 0), playing);
  showTrack(state);

  pausedSince = playing ? null : (pausedSince ?? Date.now());
  vis.playing = playing;
  $('play').classList.toggle('is-playing', playing);
  $('tag').textContent = 'Paused';
  $('tag').hidden = playing;
  screen(pausedSince && Date.now() - pausedSince > IDLE_AFTER_PAUSE_MS ? 'idle' : 'now');
}

// Keeps the screen on where the browser allows it. Phones only allow this over HTTPS or on the
// Mac itself, so on the desk phone the dependable way is Auto-Lock set to Never.
let wakeLock = null;
async function keepAwake() {
  if (!('wakeLock' in navigator) || document.visibilityState !== 'visible' || (wakeLock && !wakeLock.released)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch { /* not allowed here */ }
}
document.addEventListener('visibilitychange', keepAwake);
keepAwake();

async function poll() {
  const sent = performance.now();
  try {
    const res = await fetch('/api/state', { cache: 'no-store', signal: AbortSignal.timeout(4000) });
    apply(await res.json(), sent);
    failures = 0;
  } catch {
    failures++;
  }
  $('offline').hidden = failures < 3;
  setTimeout(poll, POLL_MS);
}

function showClock() {
  const now = new Date();
  $('clock').textContent = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(/\s?[ap]\.?m\.?/i, '');
  $('date').textContent = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}

let driftStep = 0;
function driftIdle() {   // moves the always-on clock slightly so it can't burn into the screen
  const spots = [[0, 0], [10, -8], [-8, 10], [12, 12], [-12, -6], [4, 12]];
  const [x, y] = spots[driftStep++ % spots.length];
  $('idle').style.transform = `translate(${x}px, ${y}px)`;
}

function showOffset() {
  const v = view.offset;
  $('offset').textContent = v === 0 ? 'Timing: exact' : `Timing: ${v > 0 ? '+' : '−'}${Math.abs(v).toFixed(2)}s`;
}

function revealTiming() {
  $('timing').classList.remove('off');
  requestAnimationFrame(() => placeEnglishDrop(false));
  clearTimeout(timingTimer);
  timingTimer = setTimeout(() => $('timing').classList.add('off'), 4500);
}

function toggleControls() {
  if ($('timing').classList.contains('off')) { revealTiming(); return; }
  clearTimeout(timingTimer);
  $('timing').classList.add('off');
}

function changeOffset(delta) {
  view.offset = Math.round((view.offset + delta) * 100) / 100;
  saveOffset(view.key, view.offset);
  showOffset();
  revealTiming();
  tick();
}

async function sendControl(action) {
  revealTiming();
  try {
    await fetch('/api/control?action=' + action, {
      method: 'POST', headers: { 'X-Desk-Lyrics': '1' }, signal: AbortSignal.timeout(6000),
    });
  } catch { /* the next poll shows what really happened */ }
}

$('previous').onclick = () => sendControl('previous');
$('play').onclick = () => sendControl('toggle');
$('next').onclick = () => sendControl('next');
$('tab-lyrics').onclick = () => setTab('lyrics');
$('tab-vis').onclick = () => setTab('vis');
$('tab-tidbits').onclick = () => setTab('tidbits');
new ResizeObserver(() => placeDrop(false)).observe($('tabs'));
document.addEventListener('visibilitychange', syncLevels);
new ResizeObserver(sizeVis).observe($('vis'));
$('show-roman').onclick = () => toggleExtra('roman');
for (const button of document.querySelectorAll('#timing .english button')) button.onclick = () => setEnglish(button.dataset.english);
for (const button of $('vis-pager').querySelectorAll('button')) button.onclick = () => setVisStyle(button.dataset.style);
new ResizeObserver(() => placePager(false)).observe($('vis-pager'));
$('earlier').onclick = () => changeOffset(STEP);
$('later').onclick = () => changeOffset(-STEP);
$('now').addEventListener('pointerdown', pointerDown);
$('now').addEventListener('pointermove', pointerMove);
$('now').addEventListener('pointerup', pointerEnd);
$('now').addEventListener('pointercancel', pointerEnd);
addEventListener('resize', () => placeActive(true));

showOffset();
showExtras();
showVisStyle(false);
showTab();
showClock();
setInterval(showClock, 1000);
setInterval(driftIdle, 60000);
setInterval(tick, 100);
poll();
</script>
</body>
</html>
