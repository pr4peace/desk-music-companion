<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desk Music Companion</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Desk Music">
<meta name="theme-color" content="#0b0b0d">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #0b0b0d;
    --text: #f6f4ef;
    --muted: rgba(246, 244, 239, .62);
    --accent: #f6c56f;
    --glass: rgba(255, 255, 255, .1);
    --drop: linear-gradient(180deg, rgba(255, 255, 255, .34), rgba(255, 255, 255, .14));
    --map: rgba(246, 244, 239, .46);
    --panel: rgba(30, 28, 28, .52);
    --well: rgba(255, 255, 255, .09);
    --line-idle: rgba(246, 244, 239, .26);
    --line-past: rgba(246, 244, 239, .14);
    --hair: rgba(246, 244, 239, .16);
    --pad-x: max(24px, env(safe-area-inset-left), env(safe-area-inset-right));
    --pad-top: max(22px, env(safe-area-inset-top));
    --pad-bottom: max(18px, env(safe-area-inset-bottom));
    --lyric-size: clamp(30px, 8.8vw, 68px);
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, Roboto, "Noto Sans", "Noto Sans Devanagari", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
  }
  [hidden] { display: none !important; }

  #backdrop {
    position: fixed; inset: -30%;
    background-size: cover; background-position: center;
    filter: blur(70px) saturate(1.5) brightness(.42);
    opacity: 0; transition: opacity 1.4s ease;
  }
  #backdrop.on { opacity: 1; }

  #now {
    position: fixed; inset: 0;
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
    padding: var(--pad-top) var(--pad-x) var(--pad-bottom);
    gap: 14px; touch-action: manipulation; color: var(--text);
  }
  #now.split { grid-template-rows: auto minmax(0, 1fr) clamp(138px, 26vh, 220px) auto; }
  .vis-on #now { touch-action: none; }
  #meta { display: flex; align-items: center; gap: 14px; min-width: 0; }
  #art {
    width: 56px; height: 56px; flex: none; border-radius: 8px;
    background: rgba(255, 255, 255, .08) center / cover no-repeat;
    transition: width .35s var(--ease), height .35s var(--ease), border-radius .35s var(--ease);
  }
  @media (orientation: portrait) {
    #now[data-tab="lyrics"] #art { width: 78px; height: 78px; border-radius: 11px; }
    #now[data-tab="lyrics"] #title { font-size: 20px; }
  }
  #song { min-width: 0; }
  #title, #artist { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #title { font-size: 18px; font-weight: 650; line-height: 1.25; }
  #artist { font-size: 15px; line-height: 1.3; color: var(--muted); }

  #stage {
    position: relative; overflow: hidden; min-height: 0;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 80%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 80%, transparent 100%);
  }
  #lines {
    list-style: none; position: absolute; left: 0; right: 0; top: 0;
    transition: transform .65s var(--ease);
    will-change: transform;
  }
  #lines li {
    font-size: var(--lyric-size); font-weight: 760; line-height: 1.16;
    letter-spacing: -.012em; padding-bottom: .62em;
    color: var(--line-idle); transition: color .4s ease;
    overflow-wrap: anywhere;
  }
  #lines li.past { color: var(--line-past); }
  #lines li.current { color: var(--text); }
  #lines li.gap { letter-spacing: .3em; }
  #lines li.gap.current { animation: breathe 2.2s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }

  #lines .original, #lines .roman, #lines .english { display: block; }
  #lines .roman, #lines .english { font-size: .56em; line-height: 1.24; letter-spacing: 0; margin-top: .34em; }
  #lines .roman { font-weight: 600; }
  #lines .english { font-weight: 480; opacity: .8; }
  #lines .roman:empty, #lines .english:empty, .no-roman #lines .roman, .no-english #lines .english,
  #stage:not(.plain) #lines .roman, #stage:not(.plain) #lines .english { display: none; }

  /* Words fill in as they are sung. The padding keeps tall script marks inside the fill. */
  .word {
    display: inline-block; padding: .24em .05em; margin: -.24em -.05em;
    transform-origin: 0% 100%; transition: color .12s linear;   /* swells away from the screen edge */
  }
  .word:dir(rtl) { transform-origin: 100% 100%; }
  #lines, #gloss-roman { --unsung: rgba(246, 244, 239, .42); }
  #vis-line { --unsung: rgba(246, 244, 239, .6); }
  #lines li.current .original .word, #gloss-roman .word, #vis-line .word { color: var(--unsung); }
  #lines li.current .word.sung, #gloss-roman .word.sung, #vis-line .word.sung { color: var(--text); }
  #lines li.current .word.active, #gloss-roman .word.active, #vis-line .word.active {
    color: transparent; transition: none;
    background-image: linear-gradient(90deg, var(--text) calc(var(--p, 0) * 1%), var(--unsung) 0);
    -webkit-background-clip: text; background-clip: text;
    transform: translateY(calc(var(--v, 0) * -.07em)) scale(calc(1 + var(--v, 0) * .06));
  }
  #lines li.current .word.active:dir(rtl), #gloss-roman .word.active:dir(rtl), #vis-line .word.active:dir(rtl) {
    background-image: linear-gradient(270deg, var(--text) calc(var(--p, 0) * 1%), var(--unsung) 0);
  }
  @media (prefers-reduced-motion: reduce) {
    #lines li.current .word.active, #gloss-roman .word.active, #vis-line .word.active { transform: none; }
  }

  #stage.plain { -webkit-mask-image: none; mask-image: none; }
  #stage.plain #lines { transition: transform 1.2s linear; }
  #stage.plain #lines li {
    font-size: clamp(22px, 6vw, 40px); font-weight: 620; line-height: 1.3;
    padding-bottom: .35em; color: rgba(246, 244, 239, .82);
  }

  #note {
    position: absolute; left: 0; right: 0; top: 40%; transform: translateY(-50%);
    font-size: clamp(22px, 6vw, 36px); font-weight: 620; line-height: 1.25; color: var(--muted);
  }

  #stage.vis, #stage.tidbits { -webkit-mask-image: none; mask-image: none; }
  #stage.vis #lines, #stage.vis #note, #stage.tidbits #lines, #stage.tidbits #note,
  #stage:not(.vis) #vis-note, #stage:not(.vis) #vis-lyric, #stage:not(.vis) #vis-pager, #stage:not(.tidbits) #tidbits { display: none; }
  #kolam { position: fixed; inset: 0; width: 100%; height: 100%; display: none; }
  body.vis-on.paper-on #kolam { display: block; }
  body.vis-on.paper-on #vis { display: none; }
  body.vis-on.paper-on #backdrop { visibility: hidden; }
  #stage.kolam #vis-lyric { top: 63%; }
  #stage.words #vis-line { visibility: hidden; }   /* it still tracks the sung word, unseen */
  /* Which visual is showing, and that a sideways swipe changes it: the same glass and drop as the tabs. */
  #vis-pager {
    position: absolute; left: 50%; top: 2px; translate: -50% 0; display: flex; padding: 3px; border-radius: 99px;
    background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.8); backdrop-filter: blur(22px) saturate(1.8);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), inset 0 -1px 0 rgba(0, 0, 0, .16), 0 8px 20px rgba(0, 0, 0, .26);
    opacity: .5; transition: opacity .45s ease;
  }
  #vis-pager.awake { opacity: 1; }
  #vis-pager .drop {
    position: absolute; left: 0; top: 3px; bottom: 3px; width: 0; border-radius: 99px; background: var(--drop);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 2px 8px rgba(0, 0, 0, .24);
  }
  #vis-pager button {
    position: relative; height: 32px; padding: 0 14px; border: 0; border-radius: 99px; background: transparent;
    color: var(--muted); font: inherit; font-size: 13px; font-weight: 650; cursor: pointer; transition: color .25s ease;
  }
  #vis-pager button[aria-selected="true"] { color: var(--text); }
  #stage.vis #vis-lyric { top: 44px; }
  /* Each tab's controls hold only what applies there. */
  #now:not([data-tab="lyrics"]) #timing .settings, #now[data-tab="tidbits"] #timing .nudge { display: none; }

  /* The picture fills the whole screen; everything else sits on top of it. */
  #vis { position: fixed; inset: 0; width: 100%; height: 100%; display: none; }
  .vis-on.vis-gl #vis { display: block; }
  .vis-on.vis-gl #backdrop { visibility: hidden; }
  #vis-lyric { position: absolute; inset: 0; display: grid; place-items: center; }
  #vis-line, .vis-gone {
    grid-area: 1 / 1; width: 100%; text-align: center; font-weight: 760;
    line-height: 1.14; letter-spacing: -.015em; text-wrap: balance;
  }
  .vis-gone { pointer-events: none; }
  .vis-gone .word { color: var(--text); }
  #vis-note {
    position: absolute; left: 0; right: 0; bottom: 8px; text-align: center;
    font-size: 15px; font-weight: 600; line-height: 1.3; color: var(--muted);
  }

  /* The sung words scroll above; what they mean stays in one place below. */
  #gloss { min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: .5em; padding-top: 14px; border-top: 1px solid var(--hair); }
  #gloss-roman { font-size: calc(var(--gs, 1) * clamp(23px, 6.4vw, 34px)); font-weight: 700; line-height: 1.18; letter-spacing: -.01em; }
  #gloss-english { font-size: calc(var(--gs, 1) * clamp(18px, 5vw, 26px)); font-weight: 460; line-height: 1.26; color: rgba(246, 244, 239, .82); }
  #gloss-roman:empty, #gloss-english:empty { display: none; }
  #gloss-wait { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--muted); }
  .spin { width: 16px; height: 16px; flex: none; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Each tidbit is a poster: a flood of the album's colour and one big line. */
  #tb-flood { position: fixed; inset: 0; display: none; overflow: hidden; }
  .tb-on #tb-flood { display: block; }
  .tb-on #backdrop { visibility: hidden; }
  .tb-layer { position: absolute; inset: 0; }
  .tb-layer i { position: absolute; inset: -8%; background: center / cover no-repeat; opacity: .24; filter: blur(16px) saturate(1.3); will-change: transform; }
  #now.on-light {
    --text: #14110d; --muted: rgba(20, 17, 13, .68); --hair: rgba(20, 17, 13, .2); --map: rgba(20, 17, 13, .42);
    --glass: rgba(20, 17, 13, .12); --drop: linear-gradient(180deg, rgba(255, 255, 255, .62), rgba(255, 255, 255, .3));
    --panel: rgba(255, 255, 255, .46); --well: rgba(20, 17, 13, .1);
  }
  #title, #artist, #elapsed, #remain, #tabs button, #tb-source { transition: color .3s ease; }

  #tidbits { position: absolute; inset: 0; display: grid; align-content: center; gap: 18px; }
  #tb-head {
    font-size: clamp(46px, 13.6vw, 74px); font-weight: 820; line-height: 1; letter-spacing: -.035em;
    transform-origin: left center; scale: calc(1 + var(--v, 0) * .018); margin-bottom: .24em; overflow-wrap: break-word;
  }
  #tb-head.tilt { rotate: -2.4deg; }
  .tb-w { display: inline-block; overflow: hidden; vertical-align: top; padding: .06em .03em .16em; margin: -.06em -.03em -.16em; }
  .tb-w b { display: inline-block; font-weight: inherit; }
  #tb-label { font-size: clamp(19px, 5.2vw, 26px); font-weight: 620; line-height: 1.25; color: var(--muted); margin-bottom: 12px; }
  #tb-track { display: block; height: 4px; border-radius: 4px; background: var(--hair); overflow: hidden; }
  #tb-fill { display: block; height: 100%; background: var(--text); transform-origin: left; transform: scaleX(0); transition: transform .2s linear; }
  #tb-text { font-size: clamp(20px, 5.5vw, 30px); font-weight: 560; line-height: 1.28; text-wrap: pretty; margin-bottom: 18px; }
  #tb-text:empty { display: none; }
  #tb-source { font-size: 14px; font-weight: 550; color: var(--muted); margin-bottom: 12px; }
  #tb-dots { display: flex; gap: 6px; margin-top: 4px; }
  #tb-dots i { flex: 1; height: 3px; border-radius: 3px; background: var(--hair); overflow: hidden; }
  #tb-dots b { display: block; height: 100%; background: var(--text); transform-origin: left; transform: scaleX(0); }
  #tb-note { font-size: clamp(20px, 5.6vw, 28px); font-weight: 620; line-height: 1.28; color: var(--muted); }

  /* A pool of glass with one drop of light that flows to the chosen tab. */
  #tabs {
    position: relative; display: flex; flex: none; padding: 4px; border-radius: 99px;
    background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(1.8); backdrop-filter: blur(24px) saturate(1.8);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .24), inset 0 -1px 0 rgba(0, 0, 0, .16), 0 10px 26px rgba(0, 0, 0, .3);
  }
  #tab-drop {
    position: absolute; left: 0; top: 4px; bottom: 4px; width: 0; border-radius: 99px; transform-origin: 50% 50%;
    background: var(--drop);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), inset 0 -1px 1px rgba(255, 255, 255, .14), 0 3px 10px rgba(0, 0, 0, .26);
  }
  #tabs button {
    position: relative; flex: 1; height: 44px; padding: 0 14px; border: 0; border-radius: 99px; background: transparent;
    color: var(--muted); font: inherit; font-size: 15px; font-weight: 620; cursor: pointer; transition: color .25s ease, scale .2s var(--ease);
  }
  #tabs button:active { scale: .95; }
  #tabs button[aria-selected="true"] { color: var(--text); }

  #foot { display: flex; flex-direction: column; gap: 10px; }
  #time { display: flex; align-items: center; gap: 10px; }
  #elapsed, #remain { flex: none; min-width: 38px; font-size: 13px; font-weight: 620; color: var(--muted); font-variant-numeric: tabular-nums; }
  #remain { text-align: right; }
  /* A map of the song: brighter stretches are where the singing is. */
  #bar { position: relative; flex: 1; height: 5px; border-radius: 5px; background: var(--hair); overflow: hidden; }
  #map, #map i { position: absolute; top: 0; bottom: 0; }
  #map { left: 0; right: 0; }
  #map i { background: var(--map); }
  #fill { position: absolute; inset: 0; background: var(--text); transform-origin: left; transform: scaleX(0); }
  #tag { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; font-variant-numeric: tabular-nums; }

  #idle {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: var(--pad-top) var(--pad-x) var(--pad-bottom);
    transition: transform 20s linear;
  }
  #clock {
    font-size: clamp(84px, 27vmin, 190px); font-weight: 230; line-height: 1;
    letter-spacing: -.035em; font-variant-numeric: tabular-nums;
  }
  #date { margin-top: 10px; font-size: clamp(19px, 5vmin, 30px); font-weight: 500; color: var(--muted); }
  #idle-note { margin-top: 26px; max-width: 26em; font-size: 16px; line-height: 1.4; color: var(--muted); }

  #offline {
    position: fixed; left: 50%; top: var(--pad-top); transform: translateX(-50%);
    padding: 8px 14px; border-radius: 99px; white-space: nowrap;
    background: rgba(30, 30, 34, .94); color: var(--text); font-size: 14px; font-weight: 600;
  }

  /* The controls rise out of the footer, in the same glass as the tabs. */
  #timing {
    position: fixed; left: var(--pad-x); right: var(--pad-x); bottom: calc(var(--pad-bottom) + 94px);
    display: grid; gap: 12px; padding: 14px; border-radius: 32px; color: var(--text);
    background: var(--panel); -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .24), inset 0 -1px 0 rgba(0, 0, 0, .16), 0 18px 44px rgba(0, 0, 0, .36);
    transform-origin: 50% 100%; transition: opacity .22s ease, transform .42s var(--ease);
  }
  #timing.off { opacity: 0; transform: translateY(14px) scale(.96); pointer-events: none; }
  #timing button {
    border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; display: grid; place-items: center;
    border-radius: 99px; transition: scale .2s var(--ease), color .2s ease, background .2s ease;
  }
  #timing button:active { scale: .9; }
  #timing .transport { display: flex; align-items: center; justify-content: center; gap: 18px; }
  #timing .transport button { width: 60px; height: 60px; }
  #timing .transport svg { width: 30px; height: 30px; fill: currentColor; }
  #timing #play {
    width: 74px; height: 74px; background: var(--drop);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), inset 0 -1px 1px rgba(255, 255, 255, .14), 0 5px 14px rgba(0, 0, 0, .26);
  }
  #timing #play svg { width: 36px; height: 36px; }
  #play .pause-icon, #play.is-playing .play-icon { display: none; }
  #play.is-playing .pause-icon { display: block; }
  #timing .settings { display: flex; align-items: center; justify-content: center; gap: 8px; }
  #timing .chips, #timing .nudge, #timing .english { display: flex; align-items: center; height: 48px; padding: 3px; border-radius: 99px; background: var(--well); }
  #timing .chips { flex: none; }
  #timing .nudge { min-width: 0; }
  #timing button.mode { width: 52px; height: 42px; font-size: 15px; font-weight: 680; }
  #timing .english { position: relative; flex: none; }
  #timing .english .caption { padding: 0 6px 0 11px; font-size: 12px; font-weight: 720; color: var(--muted); }
  #timing .english .drop {
    position: absolute; left: 0; top: 3px; bottom: 3px; width: 0; border-radius: 99px; background: var(--drop);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 2px 8px rgba(0, 0, 0, .22);
  }
  #timing .english button { position: relative; height: 42px; padding: 0 12px; font-size: 14px; font-weight: 650; color: var(--muted); }
  #timing .english button[aria-checked="true"] { color: var(--text); }
  #timing button.mode[aria-pressed="false"] { color: var(--muted); }
  #timing button.mode[aria-pressed="true"] {
    background: var(--drop); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 2px 8px rgba(0, 0, 0, .22);
  }
  #timing .nudge button { flex: none; width: 42px; height: 42px; font-size: 24px; font-weight: 500; }
  #timing output { flex: 1; min-width: 0; text-align: center; white-space: nowrap; font-size: 13px; font-weight: 620; font-variant-numeric: tabular-nums; color: var(--muted); }

  /* A phone lying sideways on the desk. */
  @media (orientation: landscape) and (max-height: 540px) {
    :root { --lyric-size: clamp(26px, 5.2vw, 46px); }
    #now { grid-template-columns: minmax(150px, 27%) 1fr; grid-template-rows: 1fr auto; column-gap: 32px; row-gap: 10px; }
    #meta { flex-direction: column; align-items: flex-start; justify-content: center; grid-row: 1; grid-column: 1; }
    #art { width: min(100%, 42vh); height: auto; aspect-ratio: 1; border-radius: 10px; }
    #song { width: 100%; }
    #title { font-size: 17px; }
    #artist { font-size: 14px; }
    #stage { grid-row: 1; grid-column: 2; }
    #foot { grid-row: 2; grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 16px; }
    #time { flex: 1; min-width: 0; }
    #tabs button { flex: none; height: 40px; }
    #clock { font-size: clamp(90px, 42vmin, 190px); }

    /* Sideways there is width to spare but little height, so the same split runs left to right. */
    #now.split {
      --lyric-size: clamp(23px, 3.9vw, 34px);
      grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      column-gap: 32px; row-gap: 8px;
    }
    #now.split #meta { grid-row: 1; grid-column: 2; flex-direction: row; align-items: center; justify-content: flex-start; }
    #now.split #art { width: 60px; height: 60px; aspect-ratio: auto; border-radius: 9px; }
    #now.split #song { width: auto; }
    #now.split #stage { grid-row: 1 / 3; grid-column: 1; }
    #now.split #gloss { grid-row: 2; grid-column: 2; border-top: 0; padding-top: 4px; justify-content: center; }
    #now.split #foot { grid-row: 3; grid-column: 1 / -1; }
    #gloss-roman { font-size: calc(var(--gs, 1) * clamp(21px, 3.3vw, 30px)); }
    #gloss-english { font-size: calc(var(--gs, 1) * clamp(17px, 2.5vw, 23px)); }
    #tb-head { font-size: clamp(34px, 6.2vw, 56px); }
    #stage.kolam #vis-lyric, #stage.words #vis-lyric { top: 44px; left: 52%; }
    #timing {
      left: 0; right: 0; bottom: calc(var(--pad-bottom) + 60px); width: fit-content; margin-inline: auto;
      display: flex; align-items: center; gap: 18px; padding: 10px 14px; border-radius: 30px;
    }
    #timing .transport { gap: 8px; }
    #timing .transport button { width: 52px; height: 52px; }
    #timing #play { width: 62px; height: 62px; }
    #timing .nudge { flex: none; width: 216px; }
    #tb-text { font-size: clamp(18px, 2.7vw, 24px); margin-bottom: 10px; }
    #tidbits { gap: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #lines, #stage.plain #lines, #idle { transition: none; }
    #lines li.gap.current { animation: none; }
    .spin { animation: breathe 1.6s ease-in-out infinite; }
    #tb-head { scale: 1; }
    #timing.off { transform: none; }
  }
</style>
</head>
<body>
<div id="backdrop"></div>
<canvas id="vis" aria-hidden="true"></canvas>
<canvas id="kolam" aria-hidden="true"></canvas>
<div id="tb-flood" aria-hidden="true"></div>

<main id="now" hidden>
  <header id="meta">
    <div id="art" hidden></div>
    <div id="song">
      <div id="title"></div>
      <div id="artist"></div>
    </div>
  </header>
  <section id="stage" aria-live="off">

    <p id="vis-note" hidden></p>
    <div id="vis-pager" role="tablist" aria-label="Visual style">

  <div id="timing" class="off">

      <button id="play" aria-label="Play or pause">
        <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15L20 12z"/></svg>
        <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 5H10v14H6.5zM14 5h3.5v14H14z"/></svg>
      </button>
      <button id="next" aria-label="Next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5H18v14h-2.5zM4 5v14l10.5-7z"/></svg></button>
